<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clipwell Video Editor</title>
<style>
:root{
  --bg:#0c0e12;
  --surface:#12151b;
  --surface-2:#171b23;
  --surface-3:#1e2330;
  --line:#2a3040;
  --line-soft:#202532;
  --text:#f5f7fb;
  --muted:#9aa4b5;
  --muted-2:#667085;
  --accent:#8b7cff;
  --accent-2:#6f61ff;
  --accent-soft:rgba(139,124,255,.14);
  --green:#3dd6b3;
  --danger:#ff6b77;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --radius:14px;
  --radius-sm:10px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}

.app{
  height:100vh;
  display:grid;
  grid-template-rows:56px minmax(0,1fr) 176px;
}

/* Topbar */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:rgba(14,17,23,.96);
  border-bottom:1px solid var(--line-soft);
  backdrop-filter:blur(16px);
}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.brand-mark{
  width:30px;height:30px;border-radius:9px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--green));
  color:#0c0e12;font-weight:900;font-size:14px;
}
.brand-text{font-weight:750;letter-spacing:-.2px}
.brand-sub{font-size:11px;color:var(--muted-2);margin-left:2px}

.project-name{
  font-size:13px;color:var(--muted);
  max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.top-actions{display:flex;align-items:center;gap:8px;min-width:210px;justify-content:flex-end}
.select,.top-btn{
  height:34px;
  border:1px solid var(--line);
  background:var(--surface-2);
  color:var(--text);
  border-radius:9px;
  padding:0 10px;
  font-size:12px;
  outline:none;
}
.select:hover,.top-btn:hover{background:var(--surface-3)}
.export-btn{
  border:0;
  color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  padding:0 15px;
  font-weight:700;
  box-shadow:0 8px 22px rgba(111,97,255,.25);
}

/* Workspace */
.workspace{
  min-height:0;
  display:grid;
  grid-template-columns:68px 300px minmax(0,1fr);
}

.tool-rail{
  background:#10131a;
  border-right:1px solid var(--line-soft);
  padding:12px 8px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.tool-btn{
  height:52px;
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  transition:.15s ease;
}
.tool-btn:hover:not(:disabled){background:var(--surface-2);color:#fff}
.tool-btn.active{
  background:var(--accent-soft);
  color:#c9c2ff;
  border-color:rgba(139,124,255,.28);
}
.tool-btn svg{width:19px;height:19px}
.tool-btn span{font-size:9.5px;font-weight:650}

.inspector{
  background:var(--surface);
  border-right:1px solid var(--line-soft);
  min-height:0;
  overflow:auto;
}
.inspector::-webkit-scrollbar{width:8px}
.inspector::-webkit-scrollbar-thumb{background:#2b3242;border-radius:99px}
.inspector-inner{padding:16px}
.panel-title{font-size:15px;font-weight:750;margin:0 0 4px}
.panel-desc{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 16px}

.section{
  border:1px solid var(--line-soft);
  background:var(--surface-2);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}
.section-title{font-size:12px;font-weight:700;color:#d8deea;margin-bottom:10px}
.label-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.label-row label{font-size:11.5px;color:var(--muted)}
.value{font-size:11px;color:#c9c2ff;font-variant-numeric:tabular-nums}

input[type="range"]{
  width:100%;height:4px;border-radius:99px;outline:none;
  appearance:none;background:#303746;
}
input[type="range"]::-webkit-slider-thumb{
  appearance:none;width:16px;height:16px;border-radius:50%;
  background:#fff;border:4px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.35);
}

.text-input,.number-input{
  width:100%;height:38px;border-radius:9px;
  background:#0f1218;border:1px solid var(--line);
  color:var(--text);padding:0 10px;outline:none;
}
.text-input:focus,.number-input:focus{border-color:#6357dc;box-shadow:0 0 0 3px rgba(99,87,220,.12)}

.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-btn{
  min-height:36px;border:1px solid var(--line);border-radius:9px;
  background:#0f1218;color:#d6dbe6;font-size:12px;font-weight:650;
}
.mini-btn:hover{background:#191e29}
.mini-btn.active{background:var(--accent-soft);color:#d7d2ff;border-color:rgba(139,124,255,.34)}
.mini-btn.full{width:100%}

.color-row{display:grid;grid-template-columns:1fr 42px;gap:8px;align-items:center}
input[type="color"]{
  width:42px;height:38px;border-radius:9px;border:1px solid var(--line);
  background:#0f1218;padding:3px;
}

.stage{
  min-width:0;min-height:0;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px 18px 62px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 0%,rgba(80,91,128,.14),transparent 42%),
    #0b0d12;
}

.empty-state{
  width:min(560px,90%);
  padding:48px 28px;
  text-align:center;
  border:1px dashed #394155;
  border-radius:18px;
  background:rgba(18,21,27,.86);
  box-shadow:var(--shadow);
}
.empty-icon{
  width:56px;height:56px;margin:0 auto 16px;border-radius:16px;
  display:grid;place-items:center;background:var(--accent-soft);color:#b8b0ff;
}
.empty-icon svg{width:25px;height:25px}
.empty-state h2{font-size:18px;margin:0 0 7px}
.empty-state p{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0}
.upload-main{
  margin-top:18px;height:40px;border:0;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-weight:750;padding:0 18px;
}

.canvas-shell{
  display:none;
  max-width:100%;max-height:100%;
  padding:12px;
  border-radius:16px;
  background:
    linear-gradient(45deg,#171a20 25%,transparent 25%) 0 0/18px 18px,
    linear-gradient(-45deg,#171a20 25%,transparent 25%) 0 9px/18px 18px,
    linear-gradient(45deg,transparent 75%,#171a20 75%) 9px -9px/18px 18px,
    linear-gradient(-45deg,transparent 75%,#171a20 75%) -9px 0/18px 18px,
    #11141a;
  box-shadow:var(--shadow),0 0 0 1px var(--line-soft);
}
#previewCanvas{
  display:block;
  max-width:100%;max-height:calc(100vh - 310px);
  border-radius:10px;background:#000;touch-action:none;
}

.preview-controls{
  position:absolute;
  left:50%;bottom:14px;transform:translateX(-50%);
  display:none;align-items:center;gap:10px;
  background:rgba(18,21,27,.86);
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 12px;
  backdrop-filter:blur(14px);
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.play-button{
  width:34px;height:34px;border-radius:50%;border:0;
  background:#fff;color:#0b0d12;display:grid;place-items:center;font-weight:900;
}
.time-readout{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:110px}
.volume-wrap{display:flex;align-items:center;gap:7px;color:var(--muted)}
.volume-wrap input{width:78px}

/* Timeline */
.timeline{
  background:#0f1218;
  border-top:1px solid var(--line-soft);
  padding:10px 16px 14px;
  min-height:0;
}
.timeline-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.timeline-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700}
.timeline-meta{font-size:11px;color:var(--muted)}
.timeline-track{
  position:relative;height:88px;border-radius:11px;
  background:#181d26;border:1px solid #252b39;overflow:hidden;
  user-select:none;touch-action:none;
}
.thumbs{position:absolute;inset:0;display:flex;overflow:hidden}
.thumb{flex:1;background-size:cover;background-position:center;opacity:.72;border-right:1px solid rgba(0,0,0,.25)}
.trim-mask{position:absolute;top:0;bottom:0;background:rgba(5,7,10,.74);z-index:3}
.trim-mask.left{left:0}.trim-mask.right{right:0}
.selection{position:absolute;top:0;bottom:0;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);z-index:4;pointer-events:none}
.handle{
  position:absolute;top:0;bottom:0;width:14px;z-index:6;background:var(--accent);
  cursor:ew-resize;display:grid;place-items:center;
}
.handle:after{content:"";width:2px;height:24px;border-radius:3px;background:#fff9}
.handle.left{transform:translateX(-100%);border-radius:6px 0 0 6px}
.handle.right{border-radius:0 6px 6px 0}
.playhead{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--green);z-index:7;pointer-events:none;box-shadow:0 0 8px rgba(61,214,179,.5)}
.playhead:before{content:"";position:absolute;top:0;left:50%;transform:translate(-50%,-35%);width:10px;height:10px;background:var(--green);border-radius:50%}

.toast{
  position:fixed;left:50%;bottom:196px;transform:translate(-50%,8px);
  opacity:0;pointer-events:none;z-index:100;
  background:#202532;color:#fff;border:1px solid #343b4d;
  padding:10px 14px;border-radius:10px;font-size:12px;
  transition:.18s ease;box-shadow:0 12px 30px rgba(0,0,0,.35)
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.export-overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(4,6,9,.74);backdrop-filter:blur(8px);z-index:120;
}
.export-overlay.show{display:flex}
.export-card{
  width:min(420px,90vw);background:#151922;border:1px solid #2e3545;
  border-radius:18px;padding:24px;text-align:center;box-shadow:var(--shadow)
}
.spinner{width:42px;height:42px;border:3px solid #2b3140;border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.export-card h3{margin:0 0 7px;font-size:16px}
.export-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
.progress{height:7px;background:#262c39;border-radius:99px;overflow:hidden;margin:16px 0}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .08s linear}
.export-actions{display:flex;justify-content:center;gap:8px}

@media(max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh;grid-template-rows:auto auto auto}
  .topbar{min-height:56px;flex-wrap:wrap;gap:8px;padding:10px 12px}
  .project-name{order:3;width:100%;max-width:none}
  .workspace{grid-template-columns:1fr;grid-template-rows:auto auto minmax(420px,1fr)}
  .tool-rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line-soft)}
  .tool-btn{min-width:64px;height:48px}
  .inspector{border-right:0;border-bottom:1px solid var(--line-soft);max-height:330px}
  .stage{min-height:500px;padding-bottom:72px}
  #previewCanvas{max-height:420px}
  .timeline{position:relative}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">C</div>
      <div>
        <div class="brand-text">Clipwell</div>
      </div>
      <span class="brand-sub">video editor</span>
    </div>

    <div class="project-name" id="projectName">No video selected</div>

    <div class="top-actions">
      <select class="select" id="quality" disabled>
        <option value="480">480p</option>
        <option value="720" selected>720p</option>
        <option value="1080">1080p</option>
      </select>
      <select class="select" id="fps" disabled>
        <option value="24">24 FPS</option>
        <option value="30" selected>30 FPS</option>
        <option value="60">60 FPS</option>
      </select>
      <button class="top-btn export-btn" id="exportBtn" disabled>Export</button>
    </div>
  </header>

  <div class="workspace">
    <nav class="tool-rail" id="toolRail">
      <button class="tool-btn active" data-tool="media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v6h6"/></svg>
        <span>Media</span>
      </button>
      <button class="tool-btn" data-tool="text" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M8 20h8"/></svg>
        <span>Text</span>
      </button>
      <button class="tool-btn" data-tool="adjust" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/><path d="M4 12h5"/><path d="M13 12h7"/><circle cx="11" cy="12" r="2"/></svg>
        <span>Adjust</span>
      </button>
      <button class="tool-btn" data-tool="transform" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V4h4"/><path d="M20 16v4h-4"/><path d="M5 5l5 5"/><path d="M19 19l-5-5"/><path d="M20 8V4h-4"/><path d="M19 5l-5 5"/><path d="M4 16v4h4"/><path d="M5 19l5-5"/></svg>
        <span>Transform</span>
      </button>
      <button class="tool-btn" data-tool="audio" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M18 6a8 8 0 0 1 0 12"/></svg>
        <span>Audio</span>
      </button>
    </nav>

    <aside class="inspector">
      <div class="inspector-inner" id="inspector"></div>
    </aside>

    <main class="stage" id="stage">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 20h14a2 2 0 0 0 2-2v-3"/><path d="M3 15v3a2 2 0 0 0 2 2"/></svg>
        </div>
        <h2>Start with a video</h2>
        <p>Drop a video here or choose a file from your computer.<br>Everything runs locally in your browser.</p>
        <button class="upload-main" id="chooseFileBtn">Choose video</button>
      </div>

      <div class="canvas-shell" id="canvasShell">
        <canvas id="previewCanvas" width="1280" height="720"></canvas>
      </div>

      <div class="preview-controls" id="previewControls">
        <button class="play-button" id="playBtn" title="Play / Pause">▶</button>
        <div class="time-readout" id="timeReadout">0:00 / 0:00</div>
        <div class="volume-wrap">
          <span>🔊</span>
          <input id="quickVolume" type="range" min="0" max="100" value="100" />
        </div>
      </div>

      <input id="fileInput" type="file" accept="video/*" hidden />
      <video id="video" playsinline preload="metadata" hidden></video>
    </main>
  </div>

  <section class="timeline">
    <div class="timeline-head">
      <div class="timeline-title">Timeline <span class="timeline-meta" id="trimInfo">No clip loaded</span></div>
      <div class="timeline-meta" id="clipInfo">—</div>
    </div>
    <div class="timeline-track" id="timelineTrack">
      <div class="thumbs" id="thumbs"></div>
      <div class="trim-mask left" id="maskLeft" style="width:0%"></div>
      <div class="trim-mask right" id="maskRight" style="width:0%"></div>
      <div class="selection" id="selection"></div>
      <div class="handle left" id="handleLeft"></div>
      <div class="handle right" id="handleRight"></div>
      <div class="playhead" id="playhead" style="left:0%"></div>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<div class="export-overlay" id="exportOverlay">
  <div class="export-card">
    <div class="spinner" id="exportSpinner"></div>
    <h3 id="exportTitle">Exporting your video</h3>
    <p id="exportText">This runs in real time. Keep this tab open.</p>
    <div class="progress"><div id="exportProgress"></div></div>
    <div class="export-actions">
      <button class="mini-btn" id="cancelExportBtn">Cancel</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (s) => document.querySelector(s);

  const video = $("#video");
  const canvas = $("#previewCanvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  const fileInput = $("#fileInput");
  const emptyState = $("#emptyState");
  const canvasShell = $("#canvasShell");
  const previewControls = $("#previewControls");
  const chooseFileBtn = $("#chooseFileBtn");
  const projectName = $("#projectName");
  const playBtn = $("#playBtn");
  const timeReadout = $("#timeReadout");
  const quickVolume = $("#quickVolume");
  const quality = $("#quality");
  const fpsSelect = $("#fps");
  const exportBtn = $("#exportBtn");
  const toolRail = $("#toolRail");
  const inspector = $("#inspector");
  const timelineTrack = $("#timelineTrack");
  const thumbs = $("#thumbs");
  const maskLeft = $("#maskLeft");
  const maskRight = $("#maskRight");
  const selection = $("#selection");
  const handleLeft = $("#handleLeft");
  const handleRight = $("#handleRight");
  const playhead = $("#playhead");
  const trimInfo = $("#trimInfo");
  const clipInfo = $("#clipInfo");
  const toast = $("#toast");
  const exportOverlay = $("#exportOverlay");
  const exportSpinner = $("#exportSpinner");
  const exportTitle = $("#exportTitle");
  const exportText = $("#exportText");
  const exportProgress = $("#exportProgress");
  const cancelExportBtn = $("#cancelExportBtn");

  const state = {
    loaded: false,
    activeTool: "media",
    fileName: "",
    objectUrl: null,
    duration: 0,
    trimStart: 0,
    trimEnd: 0,
    rotate: 0,
    flipH: false,
    flipV: false,
    speed: 1,
    volume: 1,
    brightness: 100,
    contrast: 100,
    saturation: 100,
    grayscale: 0,
    text: "",
    textSize: 54,
    textColor: "#ffffff",
    textX: .5,
    textY: .82,
    draggingText: false,
    isExporting: false,
    cancelExport: false,
    raf: 0,
    thumbJob: 0,
    audioCtx: null,
    sourceNode: null,
    gainNode: null,
    destination: null,
    suppressTimelineClickUntil: 0
  };

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function fmt(sec) {
    if (!Number.isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    const cs = Math.floor((sec % 1) * 100);
    return `${m}:${String(s).padStart(2, "0")}.${String(cs).padStart(2, "0")}`;
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    })[ch]);
  }

  function notify(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(notify.timer);
    notify.timer = setTimeout(() => toast.classList.remove("show"), 2400);
  }

  function waitEvent(el, name, timeout = 12000) {
    return new Promise((resolve, reject) => {
      let timer;
      const cleanup = () => {
        clearTimeout(timer);
        el.removeEventListener(name, ok);
        el.removeEventListener("error", fail);
      };
      const ok = () => { cleanup(); resolve(); };
      const fail = () => { cleanup(); reject(new Error(`Failed while waiting for ${name}`)); };
      el.addEventListener(name, ok, { once: true });
      el.addEventListener("error", fail, { once: true });
      timer = setTimeout(() => { cleanup(); reject(new Error(`Timed out waiting for ${name}`)); }, timeout);
    });
  }

  async function seekVideo(time) {
    const target = clamp(time, 0, state.duration || 0);
    if (Math.abs(video.currentTime - target) < .002 && !video.seeking) return;
    const p = waitEvent(video, "seeked", 10000);
    video.currentTime = target;
    await p;
  }

  function setActiveTool(tool) {
    state.activeTool = tool;
    toolRail.querySelectorAll(".tool-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.tool === tool);
    });
    renderInspector();
  }

  toolRail.addEventListener("click", e => {
    const btn = e.target.closest(".tool-btn");
    if (!btn || btn.disabled) return;
    setActiveTool(btn.dataset.tool);
  });

  function section(title, inner) {
    return `<div class="section"><div class="section-title">${title}</div>${inner}</div>`;
  }

  function sliderRow(label, id, value, min, max, step = 1, suffix = "%") {
    return `
      <div class="label-row"><label>${label}</label><span class="value" id="${id}Value">${value}${suffix}</span></div>
      <input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${value}" />
    `;
  }

  function renderInspector() {
    if (state.activeTool === "media") {
      inspector.innerHTML = `
        <h2 class="panel-title">Media</h2>
        <p class="panel-desc">Manage your source clip and trim the section you want to keep.</p>
        ${section("Source", `
          <div style="font-size:12px;color:#dce2ee;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${state.loaded ? escapeHTML(state.fileName) : "No video selected"}</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:10px;">${state.loaded ? `${video.videoWidth} × ${video.videoHeight} · ${fmt(state.duration)}` : "Upload a video to begin editing."}</div>
          <button class="mini-btn full" id="replaceBtn">${state.loaded ? "Replace video" : "Choose video"}</button>
        `)}
        ${state.loaded ? section("Trim", `
          <div class="button-grid">
            <button class="mini-btn" id="setStartBtn">Set start</button>
            <button class="mini-btn" id="setEndBtn">Set end</button>
          </div>
          <div style="height:8px"></div>
          <div class="label-row"><label>Start</label><span class="value">${fmt(state.trimStart)}</span></div>
          <div class="label-row"><label>End</label><span class="value">${fmt(state.trimEnd)}</span></div>
          <button class="mini-btn full" id="resetTrimBtn">Reset trim</button>
        `) : ""}
      `;
      $("#replaceBtn").onclick = () => fileInput.click();
      if (state.loaded) {
        $("#setStartBtn").onclick = () => { state.trimStart = clamp(video.currentTime, 0, state.trimEnd - .05); updateTrimUI(); renderInspector(); };
        $("#setEndBtn").onclick = () => { state.trimEnd = clamp(video.currentTime, state.trimStart + .05, state.duration); updateTrimUI(); renderInspector(); };
        $("#resetTrimBtn").onclick = () => { state.trimStart = 0; state.trimEnd = state.duration; updateTrimUI(); renderInspector(); };
      }
      return;
    }

    if (state.activeTool === "text") {
      inspector.innerHTML = `
        <h2 class="panel-title">Text</h2>
        <p class="panel-desc">Add a title or caption, then drag it directly on the preview.</p>
        ${section("Content", `
          <div class="label-row"><label>Text</label></div>
          <input class="text-input" id="textInput" value="${escapeHTML(state.text)}" placeholder="Type something..." />
          <div style="height:12px"></div>
          ${sliderRow("Size", "textSize", state.textSize, 18, 120, 1, " px")}
          <div style="height:12px"></div>
          <div class="color-row">
            <div><div class="label-row"><label>Color</label></div><div style="font-size:11px;color:var(--muted)">Text fill color</div></div>
            <input id="textColor" type="color" value="${state.textColor}" />
          </div>
        `)}
        ${section("Position", `
          ${sliderRow("Horizontal", "textX", Math.round(state.textX*100), 0, 100, 1, "%")}
          <div style="height:12px"></div>
          ${sliderRow("Vertical", "textY", Math.round(state.textY*100), 0, 100, 1, "%")}
          <div style="height:12px"></div>
          <button class="mini-btn full" id="clearTextBtn">Remove text</button>
        `)}
      `;
      $("#textInput").oninput = e => { state.text = e.target.value; drawFrame(); };
      $("#textSize").oninput = e => { state.textSize = +e.target.value; $("#textSizeValue").textContent = `${e.target.value} px`; drawFrame(); };
      $("#textColor").oninput = e => { state.textColor = e.target.value; drawFrame(); };
      $("#textX").oninput = e => { state.textX = +e.target.value/100; $("#textXValue").textContent = `${e.target.value}%`; drawFrame(); };
      $("#textY").oninput = e => { state.textY = +e.target.value/100; $("#textYValue").textContent = `${e.target.value}%`; drawFrame(); };
      $("#clearTextBtn").onclick = () => { state.text = ""; renderInspector(); drawFrame(); };
      return;
    }

    if (state.activeTool === "adjust") {
      inspector.innerHTML = `
        <h2 class="panel-title">Adjust</h2>
        <p class="panel-desc">Fine-tune the look of your video.</p>
        ${section("Color", `
          ${sliderRow("Brightness", "brightness", state.brightness, 50, 150)}
          <div style="height:14px"></div>
          ${sliderRow("Contrast", "contrast", state.contrast, 50, 150)}
          <div style="height:14px"></div>
          ${sliderRow("Saturation", "saturation", state.saturation, 0, 200)}
          <div style="height:14px"></div>
          ${sliderRow("Grayscale", "grayscale", state.grayscale, 0, 100)}
        `)}
        <button class="mini-btn full" id="resetAdjustBtn">Reset adjustments</button>
      `;
      ["brightness","contrast","saturation","grayscale"].forEach(id => {
        $("#"+id).oninput = e => {
          state[id] = +e.target.value;
          $("#"+id+"Value").textContent = `${e.target.value}%`;
          drawFrame();
        };
      });
      $("#resetAdjustBtn").onclick = () => { state.brightness=100; state.contrast=100; state.saturation=100; state.grayscale=0; renderInspector(); drawFrame(); };
      return;
    }

    if (state.activeTool === "transform") {
      inspector.innerHTML = `
        <h2 class="panel-title">Transform</h2>
        <p class="panel-desc">Rotate or mirror your clip.</p>
        ${section("Rotate", `
          <div class="button-grid">
            <button class="mini-btn" id="rotLeftBtn">↺ Left</button>
            <button class="mini-btn" id="rotRightBtn">↻ Right</button>
          </div>
          <div style="height:9px"></div>
          <div class="label-row"><label>Rotation</label><span class="value">${state.rotate}°</span></div>
        `)}
        ${section("Flip", `
          <div class="button-grid">
            <button class="mini-btn ${state.flipH?"active":""}" id="flipHBtn">Horizontal</button>
            <button class="mini-btn ${state.flipV?"active":""}" id="flipVBtn">Vertical</button>
          </div>
        `)}
      `;
      $("#rotLeftBtn").onclick = () => { state.rotate=(state.rotate+270)%360; resizePreview(); renderInspector(); drawFrame(); };
      $("#rotRightBtn").onclick = () => { state.rotate=(state.rotate+90)%360; resizePreview(); renderInspector(); drawFrame(); };
      $("#flipHBtn").onclick = () => { state.flipH=!state.flipH; renderInspector(); drawFrame(); };
      $("#flipVBtn").onclick = () => { state.flipV=!state.flipV; renderInspector(); drawFrame(); };
      return;
    }

    if (state.activeTool === "audio") {
      inspector.innerHTML = `
        <h2 class="panel-title">Audio</h2>
        <p class="panel-desc">Change playback speed and original clip volume.</p>
        ${section("Playback", `
          ${sliderRow("Speed", "speed", state.speed.toFixed(2), .25, 2, .05, "×")}
        `)}
        ${section("Volume", `
          ${sliderRow("Volume", "volume", Math.round(state.volume*100), 0, 100, 1, "%")}
        `)}
      `;
      $("#speed").oninput = e => {
        state.speed = +e.target.value;
        video.playbackRate = state.speed;
        $("#speedValue").textContent = `${state.speed.toFixed(2)}×`;
      };
      $("#volume").oninput = e => {
        state.volume = +e.target.value/100;
        quickVolume.value = e.target.value;
        applyAudio();
        $("#volumeValue").textContent = `${e.target.value}%`;
      };
    }
  }

  function resizePreview() {
    if (!state.loaded) return;
    const rotated = state.rotate % 180 !== 0;
    const sourceW = rotated ? video.videoHeight : video.videoWidth;
    const sourceH = rotated ? video.videoWidth : video.videoHeight;
    const maxW = Math.max(360, window.innerWidth - 430);
    const maxH = Math.max(260, window.innerHeight - 330);
    const scale = Math.min(maxW/sourceW, maxH/sourceH, 1);
    canvas.width = Math.max(2, Math.round(sourceW*scale));
    canvas.height = Math.max(2, Math.round(sourceH*scale));
  }

  function drawFrame(targetCtx = ctx, w = canvas.width, h = canvas.height) {
    if (!state.loaded) return;
    targetCtx.save();
    targetCtx.clearRect(0,0,w,h);
    targetCtx.fillStyle = "#000";
    targetCtx.fillRect(0,0,w,h);
    targetCtx.filter = `brightness(${state.brightness}%) contrast(${state.contrast}%) saturate(${state.saturation}%) grayscale(${state.grayscale}%)`;
    targetCtx.translate(w/2,h/2);
    targetCtx.rotate(state.rotate*Math.PI/180);
    targetCtx.scale(state.flipH?-1:1,state.flipV?-1:1);
    const dw = state.rotate%180!==0 ? h : w;
    const dh = state.rotate%180!==0 ? w : h;
    try { targetCtx.drawImage(video,-dw/2,-dh/2,dw,dh); } catch(e) {}
    targetCtx.restore();
    targetCtx.filter = "none";

    if (state.text.trim()) {
      const fontSize = Math.max(14, state.textSize*(h/720));
      targetCtx.save();
      targetCtx.font = `700 ${fontSize}px Arial, sans-serif`;
      targetCtx.textAlign = "center";
      targetCtx.textBaseline = "middle";
      targetCtx.lineWidth = Math.max(2,fontSize*.09);
      targetCtx.strokeStyle = "rgba(0,0,0,.72)";
      targetCtx.fillStyle = state.textColor;
      const x = state.textX*w;
      const y = state.textY*h;
      targetCtx.strokeText(state.text,x,y);
      targetCtx.fillText(state.text,x,y);
      targetCtx.restore();
    }
  }

  function animationLoop() {
    drawFrame();
    updateTimeUI();
    if (!video.paused && !video.ended && !state.isExporting) state.raf = requestAnimationFrame(animationLoop);
  }

  function updateTimeUI() {
    if (!state.loaded) return;
    timeReadout.textContent = `${fmt(video.currentTime)} / ${fmt(state.duration)}`;
    const frac = state.duration ? video.currentTime/state.duration : 0;
    playhead.style.left = `${frac*100}%`;
    if (!state.isExporting && !video.paused && video.currentTime >= state.trimEnd-.015) {
      video.pause();
      seekVideo(state.trimStart).then(() => { drawFrame(); updateTimeUI(); }).catch(()=>{});
    }
  }

  playBtn.onclick = async () => {
    if (!state.loaded) return;
    ensureAudioGraph();
    if (state.audioCtx?.state === "suspended") await state.audioCtx.resume().catch(()=>{});
    if (video.paused) {
      if (video.currentTime < state.trimStart || video.currentTime >= state.trimEnd) await seekVideo(state.trimStart).catch(()=>{});
      video.playbackRate = state.speed;
      try {
        await video.play();
        playBtn.textContent = "❚❚";
        animationLoop();
      } catch(e) { notify("Playback was blocked. Click play again."); }
    } else {
      video.pause();
    }
  };

  video.addEventListener("pause", () => {
    if (!state.isExporting) playBtn.textContent = "▶";
    drawFrame();
    updateTimeUI();
  });

  quickVolume.oninput = e => {
    state.volume = +e.target.value/100;
    applyAudio();
    if (state.activeTool === "audio") renderInspector();
  };

  function applyAudio() {
    if (state.gainNode) state.gainNode.gain.value = state.volume;
    else video.volume = state.volume;
  }

  function ensureAudioGraph() {
    if (state.audioCtx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      state.audioCtx = new AC();
      state.sourceNode = state.audioCtx.createMediaElementSource(video);
      state.gainNode = state.audioCtx.createGain();
      state.destination = state.audioCtx.createMediaStreamDestination();
      state.sourceNode.connect(state.gainNode);
      state.gainNode.connect(state.audioCtx.destination);
      state.gainNode.connect(state.destination);
      applyAudio();
      return true;
    } catch(e) { return false; }
  }

  function updateTrimUI() {
    if (!state.loaded) return;
    const s = state.trimStart/state.duration*100;
    const e = state.trimEnd/state.duration*100;
    maskLeft.style.width = `${s}%`;
    maskRight.style.width = `${100-e}%`;
    handleLeft.style.left = `${s}%`;
    handleRight.style.left = `${e}%`;
    selection.style.left = `${s}%`;
    selection.style.width = `${e-s}%`;
    trimInfo.textContent = `${fmt(state.trimStart)} → ${fmt(state.trimEnd)} · ${fmt(state.trimEnd-state.trimStart)}`;
  }

  function bindTrimHandle(handle, setter) {
    const down = e => {
      e.preventDefault();
      e.stopPropagation();
      let moved = false;
      const move = ev => {
        if (ev.cancelable) ev.preventDefault();
        moved = true;
        const point = ev.touches ? ev.touches[0] : ev;
        const rect = timelineTrack.getBoundingClientRect();
        const frac = clamp((point.clientX-rect.left)/rect.width,0,1);
        setter(frac*state.duration);
        updateTrimUI();
        if (state.activeTool === "media") renderInspector();
      };
      const up = () => {
        if (moved) state.suppressTimelineClickUntil = performance.now()+300;
        window.removeEventListener("mousemove",move);
        window.removeEventListener("mouseup",up);
        window.removeEventListener("touchmove",move);
        window.removeEventListener("touchend",up);
      };
      window.addEventListener("mousemove",move);
      window.addEventListener("mouseup",up);
      window.addEventListener("touchmove",move,{passive:false});
      window.addEventListener("touchend",up);
    };
    handle.addEventListener("mousedown",down);
    handle.addEventListener("touchstart",down,{passive:false});
  }

  bindTrimHandle(handleLeft, t => state.trimStart = clamp(t,0,state.trimEnd-.05));
  bindTrimHandle(handleRight, t => state.trimEnd = clamp(t,state.trimStart+.05,state.duration));

  timelineTrack.addEventListener("click", e => {
    if (!state.loaded || performance.now() < state.suppressTimelineClickUntil) return;
    const rect = timelineTrack.getBoundingClientRect();
    const frac = clamp((e.clientX-rect.left)/rect.width,0,1);
    const t = clamp(frac*state.duration,state.trimStart,state.trimEnd);
    seekVideo(t).then(() => { drawFrame(); updateTimeUI(); }).catch(()=>{});
  });

  function canvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    const point = e.touches ? e.touches[0] : e;
    return {
      x: clamp((point.clientX-rect.left)/rect.width,0,1),
      y: clamp((point.clientY-rect.top)/rect.height,0,1)
    };
  }

  canvas.addEventListener("pointerdown", e => {
    if (!state.text.trim()) return;
    state.draggingText = true;
    const p = canvasPoint(e);
    state.textX=p.x; state.textY=p.y;
    drawFrame();
    if (state.activeTool === "text") renderInspector();
  });
  window.addEventListener("pointermove", e => {
    if (!state.draggingText) return;
    const p = canvasPoint(e);
    state.textX=p.x; state.textY=p.y;
    drawFrame();
  });
  window.addEventListener("pointerup", () => {
    if (state.draggingText && state.activeTool === "text") renderInspector();
    state.draggingText=false;
  });

  chooseFileBtn.onclick = () => fileInput.click();
  fileInput.onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };

  const stage = $("#stage");
  stage.addEventListener("dragover", e => { e.preventDefault(); });
  stage.addEventListener("drop", e => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  async function loadFile(file) {
    if (!file || !(file.type||"").startsWith("video/")) {
      notify("Please choose a video file.");
      return;
    }
    state.thumbJob++;
    if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
    state.objectUrl = URL.createObjectURL(file);
    video.src = state.objectUrl;
    video.load();
    try { await waitEvent(video,"loadedmetadata",12000); }
    catch(e) { notify("This video format or codec is not supported in your browser."); return; }

    if (!Number.isFinite(video.duration) || !video.videoWidth || !video.videoHeight) {
      notify("Invalid or unsupported video file.");
      return;
    }

    state.loaded=true;
    state.fileName=file.name;
    state.duration=video.duration;
    state.trimStart=0;
    state.trimEnd=video.duration;
    state.rotate=0; state.flipH=false; state.flipV=false;
    state.brightness=100; state.contrast=100; state.saturation=100; state.grayscale=0;
    state.speed=1; video.playbackRate=1;

    projectName.textContent=file.name;
    emptyState.style.display="none";
    canvasShell.style.display="block";
    previewControls.style.display="flex";
    quality.disabled=false; fpsSelect.disabled=false; exportBtn.disabled=false;
    toolRail.querySelectorAll(".tool-btn").forEach(btn=>btn.disabled=false);
    clipInfo.textContent=`${video.videoWidth} × ${video.videoHeight}`;
    resizePreview();
    await seekVideo(0).catch(()=>{});
    drawFrame();
    updateTrimUI();
    updateTimeUI();
    setActiveTool("media");
    generateThumbnails().catch(()=>{});
  }

  async function generateThumbnails() {
    if (!state.loaded) return;
    const job = ++state.thumbJob;
    thumbs.innerHTML="";
    const tv = document.createElement("video");
    tv.src=state.objectUrl;
    tv.muted=true;
    tv.preload="metadata";
    tv.playsInline=true;
    try { await waitEvent(tv,"loadedmetadata",10000); } catch(e) { return; }
    if (job!==state.thumbJob) return;
    const count = Math.min(16, Math.max(8, Math.ceil((timelineTrack.clientWidth||900)/120)));
    const tc=document.createElement("canvas");
    tc.width=180; tc.height=Math.max(90,Math.round(180*(video.videoHeight/video.videoWidth)));
    const tctx=tc.getContext("2d");
    const cells=[];
    for(let i=0;i<count;i++){
      const cell=document.createElement("div"); cell.className="thumb"; thumbs.appendChild(cell); cells.push(cell);
    }
    for(let i=0;i<count;i++){
      if(job!==state.thumbJob) return;
      const target=Math.min((state.duration/count)*(i+.5),Math.max(0,state.duration-.05));
      try {
        const p=waitEvent(tv,"seeked",8000); tv.currentTime=target; await p;
        tctx.drawImage(tv,0,0,tc.width,tc.height);
        cells[i].style.backgroundImage=`url(${tc.toDataURL("image/jpeg",.62)})`;
      } catch(e) { return; }
    }
  }

  function exportDims() {
    const targetH=+quality.value;
    const rotated=state.rotate%180!==0;
    const aspect=rotated ? video.videoHeight/video.videoWidth : video.videoWidth/video.videoHeight;
    let h=targetH, w=Math.round(targetH*aspect);
    if(w%2) w++;
    return {w,h};
  }

  function pickMime() {
    if(typeof MediaRecorder==="undefined") return "";
    return ["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(m=>MediaRecorder.isTypeSupported(m))||"";
  }

  cancelExportBtn.onclick = () => { state.cancelExport=true; };

  exportBtn.onclick = async () => {
    if(!state.loaded || state.isExporting) return;
    const mime=pickMime();
    if(!mime){ notify("Export is not supported in this browser. Try Chrome or Edge."); return; }

    state.isExporting=true;
    state.cancelExport=false;
    exportOverlay.classList.add("show");
    exportSpinner.style.display="block";
    exportTitle.textContent="Exporting your video";
    exportText.textContent="This runs in real time. Keep this tab open.";
    exportProgress.style.width="0%";
    cancelExportBtn.textContent="Cancel";

    const oldTime=video.currentTime;
    const wasPlaying=!video.paused;
    video.pause();

    let stream;
    try {
      ensureAudioGraph();
      if(state.audioCtx?.state==="suspended") await state.audioCtx.resume().catch(()=>{});
      const {w,h}=exportDims();
      const out=document.createElement("canvas"); out.width=w; out.height=h;
      const outCtx=out.getContext("2d",{alpha:false});
      const fps=+fpsSelect.value;
      const canvasStream=out.captureStream(fps);
      const tracks=[...canvasStream.getVideoTracks()];
      if(state.destination) tracks.push(...state.destination.stream.getAudioTracks());
      stream=new MediaStream(tracks);
      const bitrate=clamp(Math.round(w*h*fps*.1),2500000,30000000);
      const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bitrate});
      const chunks=[];
      recorder.ondataavailable=e=>{ if(e.data?.size) chunks.push(e.data); };
      const stopped=new Promise((resolve,reject)=>{recorder.onstop=resolve; recorder.onerror=e=>reject(e.error||new Error("Recorder error"));});
      await seekVideo(state.trimStart);
      video.playbackRate=state.speed;
      recorder.start(500);
      await video.play();

      await new Promise(resolve=>{
        const loop=()=>{
          drawFrame(outCtx,w,h);
          const frac=(video.currentTime-state.trimStart)/Math.max(.001,state.trimEnd-state.trimStart);
          exportProgress.style.width=`${clamp(frac,0,1)*100}%`;
          if(state.cancelExport || video.currentTime>=state.trimEnd-.02 || video.ended){ resolve(); return; }
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      });

      video.pause();
      if(recorder.state!=="inactive") recorder.stop();
      await stopped;

      if(state.cancelExport){ exportOverlay.classList.remove("show"); }
      else if(chunks.length){
        const blob=new Blob(chunks,{type:mime});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download=`${(state.fileName||"edited-video").replace(/\.[^.]+$/,'')}-edited.webm`;
        document.body.appendChild(a); a.click(); a.remove();
        exportSpinner.style.display="none";
        exportTitle.textContent="Export complete";
        exportText.textContent="Your edited video has been downloaded.";
        exportProgress.style.width="100%";
        cancelExportBtn.textContent="Close";
        cancelExportBtn.onclick=()=>{ exportOverlay.classList.remove("show"); URL.revokeObjectURL(url); cancelExportBtn.onclick=()=>{state.cancelExport=true;}; };
      } else throw new Error("No video data was produced.");
    } catch(e) {
      console.error(e);
      exportOverlay.classList.remove("show");
      notify(e.message||"Export failed.");
    } finally {
      state.isExporting=false;
      try{ stream?.getTracks().forEach(t=>t.stop()); }catch(e){}
      video.playbackRate=state.speed;
      try{ await seekVideo(clamp(oldTime,state.trimStart,state.trimEnd)); }catch(e){}
      drawFrame(); updateTimeUI();
      if(wasPlaying && !state.cancelExport) video.play().then(animationLoop).catch(()=>{});
    }
  };

  window.addEventListener("resize",()=>{
    if(state.loaded){ resizePreview(); drawFrame(); clearTimeout(window.__thumbTimer); window.__thumbTimer=setTimeout(()=>generateThumbnails().catch(()=>{}),180); }
  });

  window.addEventListener("beforeunload",()=>{ if(state.objectUrl) URL.revokeObjectURL(state.objectUrl); });

  renderInspector();
})();
</script>
</body>
</html>
