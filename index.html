<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Clipwell — a friendly video editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;500;700&family=Poppins:wght@400;500;700&family=Oswald:wght@400;500;700&family=Playfair+Display:wght@400;700&family=Merriweather:wght@400;700&family=Bebas+Neue&family=Raleway:wght@400;500;700&family=Nunito:wght@400;600;700&family=Fira+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg-app:#111219; --bg-panel:#191b26; --bg-elevated:#22242f; --bg-elevated-2:#2b2e3d; --border:#33364a; --border-soft:#2a2c3a; --text-primary:#f2f3f8; --text-secondary:#9297ad; --text-muted:#5f6376; --accent:#8b7cf6; --accent-dim:#8b7cf62b; --accent-2:#4fd1c5; --accent-2-dim:#4fd1c52b; --danger:#ff6f6f; --danger-dim:#ff6f6f26; --radius-sm:8px; --radius-md:14px; --radius-lg:22px; --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --rail-w:76px; --panel-w:360px; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;} html,body{height:100%;}
  body{margin:0;background:var(--bg-app);color:var(--text-primary);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;touch-action:none;}
  ::selection{ background:var(--accent-dim); }
  button{ font-family:inherit; cursor:pointer; } input, select, textarea{ font-family:inherit; }
  #app{ display:grid; grid-template-rows:60px 1fr 168px; height:100vh; width:100vw; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid var(--border-soft); background:linear-gradient(180deg, #14151f, #111219); flex-shrink:0; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg, var(--accent), var(--accent-2)); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-weight:700; color:#12131a; font-size:15px; flex-shrink:0; }
  .brand-name{ font-family:var(--font-display); font-weight:600; font-size:17px; letter-spacing:0.2px; }
  .brand-tag{ font-size:11.5px; color:var(--text-muted); margin-left:2px; }
  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .file-name-pill{ font-size:12.5px; color:var(--text-secondary); background:var(--bg-elevated); padding:6px 12px; border-radius:20px; border:1px solid var(--border-soft); max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:none; }
  select.res-select{ background:var(--bg-elevated); color:var(--text-primary); border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:12px; outline:none; }
  select.res-select:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn{ border:none; border-radius:10px; padding:9px 16px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:transform .12s ease, filter .12s ease, opacity .12s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(135deg, var(--accent), #6a5cf0); color:#fff; box-shadow:0 4px 14px -4px #8b7cf680; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:0.4; filter:none; cursor:not-allowed; box-shadow:none; }
  .btn-ghost{ background:var(--bg-elevated); color:var(--text-primary); border:1px solid var(--border); }
  .btn-ghost:hover{ background:var(--bg-elevated-2); }
  .btn-danger{ background:var(--danger-dim); color:var(--danger); border:1px solid #ff6f6f40; }

  .workspace{ display:grid; grid-template-columns:var(--rail-w) 1fr var(--panel-w); min-height:0; }
  .rail{ background:var(--bg-panel); border-right:1px solid var(--border-soft); display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 0; overflow-y:auto; }
  .rail-btn{ width:52px; height:52px; border-radius:14px; background:transparent; border:1px solid transparent; color:var(--text-secondary); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:background .15s ease, color .15s ease; }
  .rail-btn svg{ width:19px; height:19px; pointer-events:none; }
  .rail-btn span{ font-size:9.5px; font-weight:600; letter-spacing:0.2px; pointer-events:none; }
  .rail-btn:hover:not(:disabled){ background:var(--bg-elevated); color:var(--text-primary); }
  .rail-btn.active{ background:var(--accent-dim); color:var(--accent); border-color:#8b7cf640; }
  .rail-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  .stage{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; background: radial-gradient(ellipse at 50% 0%, #1a1c28 0%, #101119 70%); min-height:0; padding:20px; }
  .canvas-wrap{ position:relative; max-width:100%; max-height:calc(100% - 46px); display:flex; align-items:center; justify-content:center;
    background-image: linear-gradient(45deg, #1c1e29 25%, transparent 25%), linear-gradient(-45deg, #1c1e29 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1c1e29 75%), linear-gradient(-45deg, transparent 75%, #1c1e29 75%); background-size:20px 20px; background-position:0 0, 0 10px, 10px -10px, -10px 0px; background-color:#151621; border-radius:12px; box-shadow:0 20px 60px -20px #00000090, 0 0 0 1px var(--border-soft); }
  #previewCanvas{ display:block; max-width:100%; max-height:100%; border-radius:12px; touch-action:none; }
  .empty-drop{ width:min(520px, 90%); border:2px dashed var(--border); border-radius:var(--radius-lg); padding:50px 30px; text-align:center; color:var(--text-secondary); cursor:pointer; background:var(--bg-panel); transition:border-color .15s ease, background .15s ease; }
  .empty-drop.dragover{ border-color:var(--accent); background:var(--accent-dim); }
  .empty-drop .icon{ width:52px; height:52px; margin:0 auto 16px; color:var(--accent); }
  .empty-drop h2{ font-family:var(--font-display); font-size:19px; margin:0 0 8px; color:var(--text-primary); }
  .empty-drop p{ font-size:13px; line-height:1.6; margin:0; color:var(--text-secondary); }
  .empty-drop .hint{ margin-top:14px; font-size:11.5px; color:var(--text-muted); }
  #fileInput{ display:none; }

  .playbar{ height:46px; display:flex; align-items:center; gap:14px; width:100%; max-width:900px; padding:0 4px; }
  .play-btn{ width:44px; height:44px; border-radius:50%; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-primary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .play-btn:hover{ background:var(--bg-elevated-2); }
  .play-btn svg{ width:16px; height:16px; }
  .time-readout{ font-size:12px; color:var(--text-secondary); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .mini-vol{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .mini-vol svg{ width:16px; height:16px; color:var(--text-secondary); flex-shrink:0; }
  .mini-vol input[type=range]{ width:80px; }

  .panel{ background:var(--bg-panel); border-left:1px solid var(--border-soft); overflow-y:auto; padding:18px 18px 30px; position:relative; }
  .panel::-webkit-scrollbar{ width:7px; }
  .panel::-webkit-scrollbar-thumb{ background:var(--bg-elevated-2); border-radius:10px; }
  .panel-title{ font-family:var(--font-display); font-size:16px; font-weight:600; margin:0 0 6px; }
  .panel-tip{ font-size:12px; color:var(--text-secondary); line-height:1.55; margin:0 0 18px; padding:10px 12px; background:var(--bg-elevated); border-radius:10px; border:1px solid var(--border-soft); }
  .field{ margin-bottom:18px; }
  .field-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:8px; font-weight:600; }
  .field-label .val{ color:var(--accent-2); font-variant-numeric:tabular-nums; }
  input[type=range]{ -webkit-appearance:none; width:100%; height:4px; border-radius:4px; background:var(--bg-elevated-2); outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--accent); border:2px solid #fff2; cursor:pointer; box-shadow:0 2px 6px #0006; }
  .btn-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ padding:10px 14px; border-radius:20px; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-secondary); font-size:12.5px; font-weight:600; }
  .chip:hover{ background:var(--bg-elevated-2); color:var(--text-primary); }
  .chip.active{ background:var(--accent-dim); border-color:#8b7cf660; color:var(--accent); }
  .preset-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
  .preset-card{ padding:10px 8px; border-radius:12px; background:var(--bg-elevated); border:1px solid var(--border); text-align:center; font-size:11.5px; font-weight:600; color:var(--text-secondary); }
  .preset-card .swatch{ height:28px; border-radius:7px; margin-bottom:7px; }
  .preset-card:hover{ color:var(--text-primary); border-color:#ffffff30; }
  .preset-card.active{ border-color:var(--accent); color:var(--accent-2); }
  hr.sep{ border:none; border-top:1px solid var(--border-soft); margin:20px 0; }

  .text-layer-card{ background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:14px; padding:12px; margin-bottom:12px; }
  .text-layer-card.selected{ border-color:var(--accent); box-shadow:0 0 0 1px #8b7cf650; }
  .text-layer-card textarea{ width:100%; resize:none; background:var(--bg-panel); color:var(--text-primary); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:13px; font-family:inherit; min-height:60px; margin-bottom:10px; }
  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .row-3{ display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center; margin-bottom:10px; }
  select.mini-select{ background:var(--bg-panel); color:var(--text-primary); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; width:100%; }
  input[type=color]{ width:40px; height:36px; border:1px solid var(--border); border-radius:8px; background:none; padding:2px; cursor:pointer; }
  .icon-btn-sm{ width:36px; height:36px; border-radius:8px; background:var(--bg-panel); border:1px solid var(--border); color:var(--text-secondary); display:flex; align-items:center; justify-content:center; }
  .icon-btn-sm:hover{ color:var(--text-primary); }
  .icon-btn-sm svg{ width:16px; height:16px; }
  .toggle-btn.on{ background:var(--accent-dim); color:var(--accent); border-color:#8b7cf660; }
  .add-text-btn{ width:100%; padding:14px; border-radius:12px; background:var(--accent-dim); border:1px dashed #8b7cf670; color:var(--accent); font-weight:600; font-size:13px; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:16px; }
  .add-text-btn:hover{ background:#8b7cf640; }
  .no-video-msg{ font-size:12.5px; color:var(--text-muted); text-align:center; padding:30px 10px; line-height:1.6; }
  .info-line{ font-size:11.5px; color:var(--text-muted); margin-top:-8px; margin-bottom:18px; }
  .align-btns{ display:flex; gap:4px; }
  .align-btns .chip{ padding:8px 12px; font-size:11px; }

  .timeline-area{ background:var(--bg-panel); border-top:1px solid var(--border-soft); padding:12px 24px 16px; display:flex; flex-direction:column; gap:8px; }
  .timeline-topline{ display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--text-muted); }
  .timeline-topline .trim-readout{ color:var(--text-secondary); font-variant-numeric:tabular-nums; }
  .timeline-track{ position:relative; height:64px; background:var(--bg-elevated); border-radius:10px; overflow:visible; border:1px solid var(--border-soft); user-select:none; touch-action:none; }
  .thumb-strip{ position:absolute; inset:0; display:flex; border-radius:10px; overflow:hidden; }
  .thumb-cell{ flex:1; background-size:cover; background-position:center; border-right:1px solid #00000030; }
  .thumb-cell:last-child{ border-right:none; }
  .trim-mask{ position:absolute; top:0; bottom:0; background:#0a0a0ecc; z-index:3; }
  .trim-mask.left{ left:0; border-radius:10px 0 0 10px; }
  .trim-mask.right{ right:0; border-radius:0 10px 10px 0; }
  .trim-handle{ position:absolute; top:-1px; bottom:-1px; width:18px; background:var(--accent); border-radius:6px; z-index:5; cursor:ew-resize; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px #0006; }
  .trim-handle::after{ content:''; width:3px; height:20px; background:#ffffffaa; border-radius:3px; }
  .trim-handle.left{ transform:translateX(-100%); border-radius:6px 2px 2px 6px; }
  .trim-handle.right{ transform:translateX(0%); border-radius:2px 6px 6px 2px; }
  .selection-border{ position:absolute; top:0; bottom:0; border-top:2px solid var(--accent); border-bottom:2px solid var(--accent); z-index:4; pointer-events:none; }
  .playhead{ position:absolute; top:-6px; bottom:-6px; width:2px; background:var(--accent-2); z-index:6; pointer-events:none; box-shadow:0 0 6px #4fd1c5aa; }
  .playhead::before{ content:''; position:absolute; top:-4px; left:50%; transform:translateX(-50%); width:10px; height:10px; background:var(--accent-2); border-radius:50%; }

  .export-overlay{ position:fixed; inset:0; background:#0a0a0ed9; backdrop-filter:blur(4px); z-index:50; display:none; align-items:center; justify-content:center; padding:20px; }
  .export-overlay.show{ display:flex; }
  .export-card{ width:400px; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; text-align:center; max-width:100%; }
  .export-card .spin{ width:44px; height:44px; margin:0 auto 18px; border-radius:50%; border:3px solid var(--bg-elevated-2); border-top-color:var(--accent); animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .export-card h3{ font-family:var(--font-display); margin:0 0 8px; font-size:17px; }
  .export-card p{ font-size:12.5px; color:var(--text-secondary); margin:0 0 20px; line-height:1.6; }
  .progress-track{ height:8px; background:var(--bg-elevated-2); border-radius:8px; overflow:hidden; margin-bottom:20px; }
  .progress-fill{ height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius:8px; transition:width .1s linear; }
  .export-card .done-icon{ width:52px; height:52px; margin:0 auto 16px; color:var(--accent-2); }
  .export-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  .panel-handle{ display:none; }
  .panel-close-mobile{ display:none; }
  .panel-overlay{ display:none; }

  /* ===================== MOBILE RESPONSIVE ===================== */
  @media (max-width: 768px) {
    :root{ --rail-w:100%; --panel-w:100%; }
    body{ touch-action:manipulation; }
    #app{ grid-template-rows:auto 1fr auto; }
    .topbar{ height:auto; padding:10px 14px; gap:8px; flex-wrap:wrap; }
    .brand-tag{ display:none; }
    .topbar-right{ flex-wrap:wrap; justify-content:flex-end; gap:6px; width:100%; }
    .file-name-pill{ max-width:120px; font-size:11px; padding:5px 10px; }
    select.res-select{ padding:6px 8px; font-size:11px; }
    .btn{ padding:8px 14px; font-size:12px; }
    .workspace{ grid-template-columns:1fr; grid-template-rows:auto 1fr auto; min-height:0; }
    .rail{ flex-direction:row; width:100%; height:auto; padding:8px; gap:6px; border-right:none; border-bottom:1px solid var(--border-soft); overflow-x:auto; -webkit-overflow-scrolling:touch; justify-content:flex-start; }
    .rail-btn{ width:auto; height:44px; flex-direction:row; padding:0 14px; gap:6px; border-radius:10px; flex-shrink:0; }
    .rail-btn svg{ width:17px; height:17px; }
    .rail-btn span{ font-size:11px; }
    .stage{ padding:10px; min-height:180px; }
    .canvas-wrap{ max-height:calc(100% - 40px); }
    .playbar{ height:40px; gap:10px; }
    .play-btn{ width:40px; height:40px; }
    .time-readout{ font-size:11px; }
    .mini-vol input[type=range]{ width:60px; }

    .panel{ position:fixed; bottom:0; left:0; right:0; width:100%; max-height:60vh; height:auto; border-left:none; border-top:1px solid var(--border-soft); border-radius:16px 16px 0 0; z-index:40; transform:translateY(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); padding:0; overflow:hidden; display:flex; flex-direction:column; }
    .panel.open{ transform:translateY(0); }
    .panel-handle{ display:flex; width:100%; justify-content:center; padding:10px 0 6px; cursor:pointer; flex-shrink:0; }
    .panel-handle::before{ content:''; width:40px; height:4px; background:var(--border); border-radius:4px; }
    .panel-close-mobile{ display:flex; position:absolute; top:8px; right:12px; z-index:2; background:var(--bg-elevated-2); }
    .panel-scroll-content{ overflow-y:auto; padding:0 18px 24px; flex:1; -webkit-overflow-scrolling:touch; }

    .panel-overlay{ display:block; position:fixed; inset:0; background:#00000080; z-index:35; opacity:0; pointer-events:none; transition:opacity .3s ease; }
    .panel-overlay.show{ opacity:1; pointer-events:auto; }

    .timeline-area{ padding:8px 12px 12px; z-index:5; position:relative; background:var(--bg-panel); }
    .timeline-track{ height:56px; }
    .trim-handle{ width:22px; }
    .export-card{ width:100%; padding:24px 20px; }
    .text-layer-card textarea{ font-size:16px; } /* prevent iOS zoom */
    input[type=range]::-webkit-slider-thumb{ width:22px; height:22px; }
  }
</style>
<base target="_blank">
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><div class="brand-mark">C</div><div><div class="brand-name">Clipwell</div></div><span class="brand-tag">— a friendly video editor</span></div>
    <div class="topbar-right">
      <span class="file-name-pill" id="fileNamePill"></span>
      <select class="res-select" id="formatSelect" title="Export format" disabled></select>
      <select class="res-select" id="fpsSelect" title="Export frame rate" disabled></select>
      <select class="res-select" id="resSelect" title="Choose quality" disabled></select>
      <button class="btn btn-primary" id="exportBtn" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Export
      </button>
    </div>
  </div>
  <div class="workspace">
    <div class="rail" id="rail">
      <button class="rail-btn active" data-tool="upload" title="Upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Upload</span></button>
      <button class="rail-btn" data-tool="trim" title="Trim" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg><span>Trim</span></button>
      <button class="rail-btn" data-tool="text" title="Text" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg><span>Text</span></button>
      <button class="rail-btn" data-tool="filters" title="Filters" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2" fill="currentColor" stroke="none"/></svg><span>Filters</span></button>
      <button class="rail-btn" data-tool="speed" title="Speed" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><line x1="12" y1="13" x2="15.5" y2="9.5"/><line x1="12" y1="5" x2="12" y2="6.5"/></svg><span>Speed</span></button>
      <button class="rail-btn" data-tool="transform" title="Rotate" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg><span>Rotate</span></button>
      <button class="rail-btn" data-tool="audio" title="Audio" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg><span>Audio</span></button>
    </div>
    <div class="stage" id="stage">
      <div class="canvas-wrap" id="canvasWrap" style="display:none;"><canvas id="previewCanvas" width="854" height="480"></canvas></div>
      <div class="empty-drop" id="dropZone">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <h2>Drop a video here to start</h2>
        <p>Or click to browse. MP4, WebM and MOV all work great.<br>Edit at up to 4K with 60 FPS export.</p>
        <div class="hint">No account, no watermark, nothing leaves your device.</div>
      </div>
      <input type="file" id="fileInput" accept="video/*">
      <div class="playbar" id="playbar" style="display:none;">
        <button class="play-btn" id="playBtn" title="Play / pause (space)"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
        <span class="time-readout" id="timeReadout">0:00 / 0:00</span>
        <div class="mini-vol" title="Preview volume">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
          <input type="range" id="quickVol" min="0" max="100" value="100">
        </div>
      </div>
    </div>
    <div class="panel" id="panel">
      <div class="panel-handle" id="panelHandle"></div>
      <button class="icon-btn-sm panel-close-mobile" id="panelCloseMobile" title="Close panel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="panel-scroll-content" id="panelScroll"></div>
    </div>
  </div>
  <div class="timeline-area">
    <div class="timeline-topline"><span>Timeline</span><span class="trim-readout" id="trimReadout">Keeping 0:00 – 0:00 · Clip length 0:00</span></div>
    <div class="timeline-track" id="timelineTrack">
      <div class="thumb-strip" id="thumbStrip"></div>
      <div class="trim-mask left" id="maskLeft" style="width:0%;"></div>
      <div class="trim-mask right" id="maskRight" style="width:0%;"></div>
      <div class="selection-border" id="selBorder"></div>
      <div class="trim-handle left" id="handleLeft"></div>
      <div class="trim-handle right" id="handleRight"></div>
      <div class="playhead" id="playhead" style="left:0%;"></div>
    </div>
  </div>
</div>
<div class="panel-overlay" id="panelOverlay"></div>
<div class="export-overlay" id="exportOverlay"><div class="export-card" id="exportCard"></div></div>
<script>
(function(){
"use strict";

const RESOLUTIONS = [
  {id:'144p', label:'144p · Tiny', height:144},{id:'240p', label:'240p · Low', height:240},
  {id:'360p', label:'360p · Low', height:360},{id:'480p', label:'480p · SD', height:480},
  {id:'720p', label:'720p · HD', height:720},{id:'1080p', label:'1080p · Full HD', height:1080},
  {id:'1440p', label:'1440p · 2K', height:1440},{id:'2160p', label:'2160p · 4K', height:2160},
];

const FORMATS = [
  {id:'mp4', label:'MP4', mime:'video/mp4;codecs=avc1.42E01E,mp4a.40.2', ext:'mp4'},
  {id:'webm', label:'WebM', mime:'video/webm;codecs=vp9,opus', ext:'webm'},
  {id:'webm-vp8', label:'WebM VP8', mime:'video/webm;codecs=vp8,opus', ext:'webm'},
];

const FPS_OPTIONS = [{id:24, label:'24 FPS'},{id:30, label:'30 FPS'},{id:60, label:'60 FPS'}];

const FILTER_PRESETS = [
  {id:'original', label:'Original', swatch:'#5b5f70', values:{brightness:100,contrast:100,saturation:100,grayscale:0,sepia:0,blur:0}},
  {id:'vivid', label:'Vivid', swatch:'linear-gradient(135deg,#ff8a65,#8b7cf6)', values:{brightness:105,contrast:118,saturation:145,grayscale:0,sepia:0,blur:0}},
  {id:'bw', label:'B & W', swatch:'linear-gradient(135deg,#eee,#555)', values:{brightness:105,contrast:110,saturation:100,grayscale:100,sepia:0,blur:0}},
  {id:'warm', label:'Warm', swatch:'linear-gradient(135deg,#ffcf86,#ff8a65)', values:{brightness:104,contrast:104,saturation:112,grayscale:0,sepia:28,blur:0}},
  {id:'cool', label:'Cool', swatch:'linear-gradient(135deg,#8fd3f4,#4fd1c5)', values:{brightness:102,contrast:106,saturation:98,grayscale:0,sepia:0,blur:0,coolTint:true}},
  {id:'vintage', label:'Vintage', swatch:'linear-gradient(135deg,#d9c08c,#8a6f4d)', values:{brightness:98,contrast:92,saturation:78,grayscale:0,sepia:45,blur:0}},
];

const FONT_OPTIONS = [
  {v:"'Inter', sans-serif", label:'Inter'},{v:"'Space Grotesk', sans-serif", label:'Space Grotesk'},
  {v:"'Roboto', sans-serif", label:'Roboto'},{v:"'Open Sans', sans-serif", label:'Open Sans'},
  {v:"'Lato', sans-serif", label:'Lato'},{v:"'Montserrat', sans-serif", label:'Montserrat'},
  {v:"'Poppins', sans-serif", label:'Poppins'},{v:"'Oswald', sans-serif", label:'Oswald'},
  {v:"'Playfair Display', serif", label:'Playfair Display'},{v:"'Merriweather', serif", label:'Merriweather'},
  {v:"'Bebas Neue', sans-serif", label:'Bebas Neue'},{v:"'Raleway', sans-serif", label:'Raleway'},
  {v:"'Nunito', sans-serif", label:'Nunito'},{v:"'Fira Sans', sans-serif", label:'Fira Sans'},
  {v:"'Courier New', monospace", label:'Courier New'},{v:"Georgia, serif", label:'Georgia'},
  {v:"'Times New Roman', serif", label:'Times New Roman'},{v:"Arial, sans-serif", label:'Arial'},
  {v:"Impact, sans-serif", label:'Impact'},{v:"'Comic Sans MS', cursive", label:'Comic Sans MS'},
];

const state = {
  videoLoaded:false, fileName:'', video:null, thumbVideo:null, duration:0, videoW:16, videoH:9,
  trimStart:0, trimEnd:0, playbackRate:1, volume:100, muted:false, rotate:0, flipH:false, flipV:false,
  resolution:'1080p', exportFormat:'mp4', exportFps:60,
  filters:{brightness:100,contrast:100,saturation:100,grayscale:0,sepia:0,blur:0},
  texts:[], selectedTextId:null, activeTool:'upload', isPlaying:false, isExporting:false, exportCancelled:false,
  audioCtx:null, sourceNode:null, gainNode:null, streamDest:null,
  previewRaf:null, exportRaf:null, draggingText:null, nextTextId:1, activeFilterPreset:'original',
};

const $ = sel => document.querySelector(sel);
const dropZone = $('#dropZone'), fileInput = $('#fileInput'), canvasWrap = $('#canvasWrap'), canvas = $('#previewCanvas'), ctx = canvas.getContext('2d');
const playbar = $('#playbar'), playBtn = $('#playBtn'), playIcon = $('#playIcon'), timeReadout = $('#timeReadout'), quickVol = $('#quickVol');
const resSelect = $('#resSelect'), formatSelect = $('#formatSelect'), fpsSelect = $('#fpsSelect'), exportBtn = $('#exportBtn'), fileNamePill = $('#fileNamePill');
const rail = $('#rail'), panel = $('#panel'), panelScroll = $('#panelScroll'), panelHandle = $('#panelHandle'), panelCloseMobile = $('#panelCloseMobile'), panelOverlay = $('#panelOverlay');
const timelineTrack = $('#timelineTrack'), thumbStrip = $('#thumbStrip');
const maskLeft = $('#maskLeft'), maskRight = $('#maskRight'), selBorder = $('#selBorder'), handleLeft = $('#handleLeft'), handleRight = $('#handleRight'), playhead = $('#playhead');
const trimReadout = $('#trimReadout'), exportOverlay = $('#exportOverlay'), exportCard = $('#exportCard');

function isMobile(){ return window.innerWidth <= 768; }

function openPanel(){ if(isMobile()){ panel.classList.add('open'); panelOverlay.classList.add('show'); } }
function closePanel(){ if(isMobile()){ panel.classList.remove('open'); panelOverlay.classList.remove('show'); } }
panelHandle.addEventListener('click', closePanel);
panelCloseMobile.addEventListener('click', closePanel);
panelOverlay.addEventListener('click', closePanel);

function fmtTime(sec){ if(!isFinite(sec)||sec<0)sec=0; const m=Math.floor(sec/60), s=Math.floor(sec%60), ms=Math.floor((sec%1)*100); return m+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(2,'0'); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function waitForSeek(videoEl){ return new Promise(resolve=>{ const h=()=>{videoEl.removeEventListener('seeked',h);resolve();}; videoEl.addEventListener('seeked',h); }); }
function waitForEvent(target, ev){ return new Promise(resolve=>{ const h=()=>{target.removeEventListener(ev,h);resolve();}; target.addEventListener(ev,h); }); }

function populateSelects(){
  resSelect.innerHTML = RESOLUTIONS.map(r=>`<option value="${r.id}" ${r.id===state.resolution?'selected':''}>${r.label}</option>`).join('');
  const supported = FORMATS.filter(f=> typeof MediaRecorder!=='undefined' && MediaRecorder.isTypeSupported(f.mime));
  if(supported.length===0){ formatSelect.innerHTML='<option value="webm">WebM</option>'; }
  else {
    formatSelect.innerHTML = supported.map(f=>`<option value="${f.id}" ${f.id===state.exportFormat?'selected':''}>${f.label}</option>`).join('');
    if(!supported.find(f=>f.id===state.exportFormat)) state.exportFormat = supported[0].id;
  }
  fpsSelect.innerHTML = FPS_OPTIONS.map(f=>`<option value="${f.id}" ${f.id===state.exportFps?'selected':''}>${f.label}</option>`).join('');
}
populateSelects();

function pickFile(){ fileInput.click(); }
dropZone.addEventListener('click', pickFile);
dropZone.addEventListener('dragover', e=>{ e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e=>{ e.preventDefault(); dropZone.classList.remove('dragover'); const f=e.dataTransfer.files[0]; if(f) loadFile(f); });
fileInput.addEventListener('change', e=>{ const f=e.target.files[0]; if(f) loadFile(f); });

async function loadFile(file){
  if(!file.type.startsWith('video/')){ alert('Please choose a video file (MP4, WebM, MOV...)'); return; }
  const url = URL.createObjectURL(file);
  if(state.video){ state.video.pause(); state.video.src=''; }
  if(state.thumbVideo){ state.thumbVideo.pause(); state.thumbVideo.src=''; }
  if(state.audioCtx){ try{state.audioCtx.close();}catch(e){} state.audioCtx=null; state.sourceNode=null; state.gainNode=null; state.streamDest=null; }

  const video=document.createElement('video'); video.src=url; video.preload='auto'; video.playsInline=true; video.crossOrigin='anonymous'; video.style.display='none'; document.body.appendChild(video); state.video=video;
  const thumbVideo=document.createElement('video'); thumbVideo.src=url; thumbVideo.preload='auto'; thumbVideo.muted=true; thumbVideo.style.display='none'; document.body.appendChild(thumbVideo); state.thumbVideo=thumbVideo;

  await waitForEvent(video,'loadedmetadata');
  state.videoLoaded=true; state.fileName=file.name; state.duration=video.duration; state.videoW=video.videoWidth||16; state.videoH=video.videoHeight||9;
  state.trimStart=0; state.trimEnd=state.duration; state.texts=[]; state.selectedTextId=null; state.rotate=0; state.flipH=false; state.flipV=false;
  state.filters={brightness:100,contrast:100,saturation:100,grayscale:0,sepia:0,blur:0}; state.activeFilterPreset='original'; state.playbackRate=1;

  dropZone.style.display='none'; canvasWrap.style.display='flex'; playbar.style.display='flex'; fileNamePill.style.display='inline-block'; fileNamePill.textContent=file.name;
  resSelect.disabled=false; formatSelect.disabled=false; fpsSelect.disabled=false; exportBtn.disabled=false;
  rail.querySelectorAll('.rail-btn').forEach(b=>b.disabled=false);

  video.addEventListener('play', ()=>{ state.isPlaying=true; updatePlayIcon(); startPreviewLoop(); });
  video.addEventListener('pause', ()=>{ state.isPlaying=false; updatePlayIcon(); });
  video.addEventListener('timeupdate', ()=>{
    if(!state.isExporting){ if(video.currentTime>=state.trimEnd){ video.pause(); video.currentTime=state.trimStart; } updateTimeUI(); }
  });

  resizeCanvasForPreview();
  setActiveTool('trim');
  drawStaticFrame();
  generateThumbnails();
  updateTrimUI();
  updateTimeUI();
}

function ensureAudioGraph(){
  if(state.audioCtx) return;
  const AC=window.AudioContext||window.webkitAudioContext; state.audioCtx=new AC();
  state.sourceNode=state.audioCtx.createMediaElementSource(state.video);
  state.gainNode=state.audioCtx.createGain(); state.gainNode.gain.value=state.muted?0:state.volume/100;
  state.sourceNode.connect(state.gainNode); state.gainNode.connect(state.audioCtx.destination);
  state.streamDest=state.audioCtx.createMediaStreamDestination(); state.gainNode.connect(state.streamDest);
}

function getOutputDims(forResId){
  const rotated=(state.rotate%180)!==0;
  const aspect=rotated?(state.videoH/state.videoW):(state.videoW/state.videoH);
  const preset=RESOLUTIONS.find(r=>r.id===(forResId||state.resolution))||RESOLUTIONS[5];
  let h=preset.height, w=Math.round((h*aspect)/2)*2; if(w<2)w=2; return {w,h};
}
function getPreviewDims(){
  const rotated=(state.rotate%180)!==0;
  const aspect=rotated?(state.videoH/state.videoW):(state.videoW/state.videoH);
  const cap=480; let h=Math.min(cap, rotated?state.videoW:state.videoH)||cap; if(h>cap)h=cap; let w=Math.round(h*aspect); return {w,h};
}
function resizeCanvasForPreview(){ const {w,h}=getPreviewDims(); canvas.width=w; canvas.height=h; }

function buildFilterString(pxWidth){
  const f=state.filters; const blurPx=(f.blur*pxWidth/1000).toFixed(2);
  return `brightness(${f.brightness}%) contrast(${f.contrast}%) saturate(${f.saturation}%) grayscale(${f.grayscale}%) sepia(${f.sepia}%) blur(${blurPx}px)`;
}

function renderFrame(targetCtx, w, h, opts){
  opts=opts||{}; const source=state.video;
  targetCtx.save(); targetCtx.clearRect(0,0,w,h); targetCtx.fillStyle='#000'; targetCtx.fillRect(0,0,w,h);
  targetCtx.filter=buildFilterString(w);
  targetCtx.translate(w/2,h/2); targetCtx.rotate(state.rotate*Math.PI/180); targetCtx.scale(state.flipH?-1:1, state.flipV?-1:1);
  let dw,dh; if(state.rotate%180!==0){dw=h;dh=w;}else{dw=w;dh=h;}
  try{ targetCtx.drawImage(source,-dw/2,-dh/2,dw,dh); }catch(e){}
  targetCtx.restore(); targetCtx.filter='none';
  if(state.filters.coolTint){ targetCtx.save(); targetCtx.globalCompositeOperation='overlay'; targetCtx.fillStyle='rgba(90,150,220,0.12)'; targetCtx.fillRect(0,0,w,h); targetCtx.restore(); }
  drawTextOverlays(targetCtx,w,h,!!opts.forExport);
}

function drawTextOverlays(targetCtx, w, h, forExport){
  state.texts.forEach(t=>{
    const lines=(t.text||'Your text').split('\n');
    const fontPx=Math.max(8, t.sizeFrac*h);
    targetCtx.save(); targetCtx.globalAlpha=t.opacity/100;
    targetCtx.font=`${t.bold?'700':'500'} ${fontPx}px ${t.font}`;
    targetCtx.textAlign=t.align||'center'; targetCtx.textBaseline='middle';
    const lineH=fontPx*(t.lineHeight||1.2); const totalH=lines.length*lineH;
    const x=t.xFrac*w, y=t.yFrac*h - (totalH/2) + (lineH/2);

    lines.forEach((line,i)=>{
      const ly=y+i*lineH;
      if(t.backgroundColor && t.backgroundColor!=='transparent'){
        const metrics=targetCtx.measureText(line); const textW=metrics.width; const pad=fontPx*0.25;
        let bx; if(t.align==='left') bx=x-pad; else if(t.align==='right') bx=x-textW-pad; else bx=x-textW/2-pad;
        targetCtx.fillStyle=t.backgroundColor; targetCtx.fillRect(bx, ly-fontPx/2-pad, textW+pad*2, fontPx+pad*2);
      }
      targetCtx.shadowColor='rgba(0,0,0,0.55)'; targetCtx.shadowBlur=fontPx*0.12; targetCtx.shadowOffsetY=fontPx*0.03;
      if(t.strokeWidth>0){ targetCtx.lineWidth=t.strokeWidth*(fontPx/18); targetCtx.strokeStyle=t.strokeColor||'#000'; targetCtx.strokeText(line,x,ly); }
      targetCtx.fillStyle=t.color; targetCtx.fillText(line,x,ly);
      targetCtx.shadowColor='transparent';
    });
    targetCtx.restore();

    if(!forExport && t.id===state.selectedTextId){
      const metrics=measureTextBox(targetCtx,t,w,h);
      targetCtx.save(); targetCtx.strokeStyle='#8b7cf6'; targetCtx.setLineDash([5,4]); targetCtx.lineWidth=1.5; targetCtx.strokeRect(metrics.x,metrics.y,metrics.w,metrics.h); targetCtx.restore();
    }
  });
}

function measureTextBox(targetCtx, t, w, h){
  const lines=(t.text||'Your text').split('\n'); const fontPx=Math.max(8, t.sizeFrac*h); const lineH=fontPx*(t.lineHeight||1.2);
  targetCtx.save(); targetCtx.font=`${t.bold?'700':'500'} ${fontPx}px ${t.font}`;
  let maxW=0; lines.forEach(line=>{ const tw=targetCtx.measureText(line).width; if(tw>maxW)maxW=tw; });
  targetCtx.restore(); const pad=fontPx*0.35; const totalH=lines.length*lineH; const cx=t.xFrac*w, cy=t.yFrac*h;
  let x; if(t.align==='left') x=cx-pad; else if(t.align==='right') x=cx-maxW-pad; else x=cx-maxW/2-pad;
  return {x, y:cy-totalH/2-pad, w:maxW+pad*2, h:totalH+pad*2};
}

function drawStaticFrame(){ if(!state.videoLoaded) return; renderFrame(ctx, canvas.width, canvas.height, {forExport:false}); }
function startPreviewLoop(){
  cancelAnimationFrame(state.previewRaf);
  function loop(){ if(!state.isExporting) renderFrame(ctx, canvas.width, canvas.height, {forExport:false}); if(state.isPlaying && !state.isExporting) state.previewRaf=requestAnimationFrame(loop); }
  state.previewRaf=requestAnimationFrame(loop);
}

function updatePlayIcon(){ playIcon.innerHTML = state.isPlaying ? '<rect x="5" y="4" width="5" height="16" rx="1"></rect><rect x="14" y="4" width="5" height="16" rx="1"></rect>' : '<polygon points="6 3 20 12 6 21 6 3"></polygon>'; }
playBtn.addEventListener('click', async ()=>{
  if(!state.videoLoaded) return; ensureAudioGraph(); if(state.audioCtx.state==='suspended') await state.audioCtx.resume();
  if(state.video.paused){ if(state.video.currentTime>=state.trimEnd||state.video.currentTime<state.trimStart) state.video.currentTime=state.trimStart; state.video.play(); }
  else state.video.pause();
});
document.addEventListener('keydown', e=>{ if(e.code==='Space' && document.activeElement.tagName!=='INPUT' && document.activeElement.tagName!=='TEXTAREA'){ e.preventDefault(); playBtn.click(); } });

function updateTimeUI(){ if(!state.videoLoaded) return; timeReadout.textContent=`${fmtTime(state.video.currentTime)} / ${fmtTime(state.duration)}`; const frac=state.duration?state.video.currentTime/state.duration:0; playhead.style.left=(frac*100)+'%'; }
setInterval(()=>{ if(state.videoLoaded && !state.isExporting) updateTimeUI(); }, 200);

quickVol.addEventListener('input', ()=>{ state.volume=+quickVol.value; state.muted=state.volume===0; if(state.gainNode) state.gainNode.gain.value=state.muted?0:state.volume/100; syncAudioPanelUI(); });

rail.addEventListener('click', e=>{ const btn=e.target.closest('.rail-btn'); if(!btn||btn.disabled) return; setActiveTool(btn.dataset.tool); });
function setActiveTool(tool){
  state.activeTool=tool;
  rail.querySelectorAll('.rail-btn').forEach(b=>b.classList.toggle('active', b.dataset.tool===tool));
  renderPanel();
  openPanel();
}

function setPanelHTML(html){
  panelScroll.innerHTML = html;
}

function renderPanel(){
  if(!state.videoLoaded && state.activeTool!=='upload'){ setPanelHTML(`<div class="no-video-msg">Upload a video to unlock this tool.</div>`); return; }
  const renderers={upload:renderUploadPanel, trim:renderTrimPanel, text:renderTextPanel, filters:renderFiltersPanel, speed:renderSpeedPanel, transform:renderTransformPanel, audio:renderAudioPanel};
  (renderers[state.activeTool]||renderUploadPanel)();
}

function renderUploadPanel(){
  setPanelHTML(`<div class="panel-title">Your video</div>
    <div class="panel-tip">Upload a clip to get started. Once loaded, use the tools on the left to trim, add text, apply filters, change speed, rotate, or adjust volume — then export in any resolution from 144p to 4K at up to 60 FPS.</div>
    ${state.videoLoaded?`<div class="field"><div class="field-label"><span>File</span></div><div class="info-line" style="margin:0;">${state.fileName}</div></div>
    <div class="field"><div class="field-label"><span>Original resolution</span></div><div class="info-line" style="margin:0;">${state.videoW} x ${state.videoH}px - ${fmtTime(state.duration)} long</div></div>`:''}
    <button class="btn btn-ghost" style="width:100%; justify-content:center;" id="uploadAnotherBtn">${state.videoLoaded?'Replace video':'Choose a video file'}</button>`);
  $('#uploadAnotherBtn').addEventListener('click', pickFile);
}

function renderTrimPanel(){
  setPanelHTML(`<div class="panel-title">Trim</div>
    <div class="panel-tip">Drag the purple handles on the timeline to choose which part to keep.</div>
    <div class="field"><div class="field-label"><span>Start</span><span class="val">${fmtTime(state.trimStart)}</span></div><div class="btn-row"><button class="chip" id="trimStartNow">Set to playhead</button><button class="chip" id="trimStartMinus">-0.5s</button><button class="chip" id="trimStartPlus">+0.5s</button></div></div>
    <div class="field"><div class="field-label"><span>End</span><span class="val">${fmtTime(state.trimEnd)}</span></div><div class="btn-row"><button class="chip" id="trimEndNow">Set to playhead</button><button class="chip" id="trimEndMinus">-0.5s</button><button class="chip" id="trimEndPlus">+0.5s</button></div></div>
    <hr class="sep"><button class="btn btn-ghost" style="width:100%; justify-content:center;" id="resetTrim">Reset to full clip</button>`);
  $('#trimStartNow').onclick=()=>{state.trimStart=clamp(state.video.currentTime,0,state.trimEnd-0.1);afterTrimChange();};
  $('#trimEndNow').onclick=()=>{state.trimEnd=clamp(state.video.currentTime,state.trimStart+0.1,state.duration);afterTrimChange();};
  $('#trimStartMinus').onclick=()=>{state.trimStart=clamp(state.trimStart-0.5,0,state.trimEnd-0.1);afterTrimChange();};
  $('#trimStartPlus').onclick=()=>{state.trimStart=clamp(state.trimStart+0.5,0,state.trimEnd-0.1);afterTrimChange();};
  $('#trimEndMinus').onclick=()=>{state.trimEnd=clamp(state.trimEnd-0.5,state.trimStart+0.1,state.duration);afterTrimChange();};
  $('#trimEndPlus').onclick=()=>{state.trimEnd=clamp(state.trimEnd+0.5,state.trimStart+0.1,state.duration);afterTrimChange();};
  $('#resetTrim').onclick=()=>{state.trimStart=0;state.trimEnd=state.duration;afterTrimChange();};
}
function afterTrimChange(){ updateTrimUI(); renderPanel(); }

function renderTextPanel(){
  let html=`<div class="panel-title">Text</div>
    <div class="panel-tip">Add captions or titles. Drag them on the preview to position. Press Enter in the box for new lines.</div>
    <button class="add-text-btn" id="addTextBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add text
    </button>`;
  if(state.texts.length===0){
    html+=`<div class="no-video-msg">No text yet. Add your first caption above.</div>`;
  } else {
    state.texts.forEach(t=>{

/* ---------- CANVAS INTERACTIONS (mouse + touch) ---------- */
function getCanvasPos(e){
  const rect=canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x:(clientX-rect.left)*(canvas.width/rect.width), y:(clientY-rect.top)*(canvas.height/rect.height), clientX, clientY };
}

canvas.addEventListener('mousedown', onCanvasDown);
canvas.addEventListener('touchstart', onCanvasDown, {passive:false});
function onCanvasDown(e){
  if(!state.videoLoaded || state.texts.length===0) return;
  if(e.type==='touchstart') e.preventDefault();
  const pos=getCanvasPos(e);
  let hit=null;
  for(let i=state.texts.length-1;i>=0;i--){
    const t=state.texts[i];
    const box=measureTextBox(ctx,t,canvas.width,canvas.height);
    if(pos.x>=box.x && pos.x<=box.x+box.w && pos.y>=box.y && pos.y<=box.y+box.h){ hit=t; break; }
  }
  if(hit){
    state.selectedTextId=hit.id;
    state.draggingText={ id:hit.id, offX:pos.x/canvas.width-hit.xFrac, offY:pos.y/canvas.height-hit.yFrac };
    if(state.activeTool==='text') renderTextPanel();
    else setActiveTool('text');
    drawStaticFrame();
  }
}

window.addEventListener('mousemove', onCanvasMove);
window.addEventListener('touchmove', onCanvasMove, {passive:false});
function onCanvasMove(e){
  if(!state.draggingText) return;
  if(e.type==='touchmove') e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  const px=(clientX-rect.left)/rect.width, py=(clientY-rect.top)/rect.height;
  const t=state.texts.find(x=>x.id===state.draggingText.id);
  if(t){ t.xFrac=clamp(px-state.draggingText.offX,0,1); t.yFrac=clamp(py-state.draggingText.offY,0,1); if(!state.isPlaying) drawStaticFrame(); }
}

window.addEventListener('mouseup', ()=>{ state.draggingText=null; });
window.addEventListener('touchend', ()=>{ state.draggingText=null; });

function updateTrimUI(){
  if(!state.videoLoaded) return;
  const sFrac=state.trimStart/state.duration*100, eFrac=state.trimEnd/state.duration*100;
  maskLeft.style.width=sFrac+'%'; maskRight.style.width=(100-eFrac)+'%';
  handleLeft.style.left=sFrac+'%'; handleRight.style.left=eFrac+'%';
  selBorder.style.left=sFrac+'%'; selBorder.style.width=(eFrac-sFrac)+'%';
  trimReadout.textContent=`Keeping ${fmtTime(state.trimStart)} - ${fmtTime(state.trimEnd)} · Clip length ${fmtTime(state.trimEnd-state.trimStart)}`;
}

function trackDrag(handleEl, onMove){
  function onDown(e){
    e.preventDefault(); e.stopPropagation();
    function onMoveWin(ev){
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      const rect=timelineTrack.getBoundingClientRect();
      const frac=clamp((clientX-rect.left)/rect.width,0,1);
      onMove(frac*state.duration);
    }
    function onUpWin(){ window.removeEventListener('mousemove', onMoveWin); window.removeEventListener('mouseup', onUpWin); window.removeEventListener('touchmove', onMoveWin); window.removeEventListener('touchend', onUpWin); }
    window.addEventListener('mousemove', onMoveWin);
    window.addEventListener('mouseup', onUpWin);
    window.addEventListener('touchmove', onMoveWin, {passive:false});
    window.addEventListener('touchend', onUpWin);
  }
  handleEl.addEventListener('mousedown', onDown);
  handleEl.addEventListener('touchstart', onDown, {passive:false});
}
trackDrag(handleLeft, t=>{ state.trimStart=clamp(t,0,state.trimEnd-0.1); updateTrimUI(); if(state.activeTool==='trim') renderTrimPanel(); });
trackDrag(handleRight, t=>{ state.trimEnd=clamp(t,state.trimStart+0.1,state.duration); updateTrimUI(); if(state.activeTool==='trim') renderTrimPanel(); });

timelineTrack.addEventListener('click', onTrackClick);
timelineTrack.addEventListener('touchend', onTrackClick);
function onTrackClick(e){
  if(!state.videoLoaded) return;
  const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
  const rect=timelineTrack.getBoundingClientRect();
  if(clientX<rect.left || clientX>rect.right) return;
  const frac=clamp((clientX-rect.left)/rect.width,0,1);
  const t=clamp(frac*state.duration, state.trimStart, state.trimEnd);
  state.video.currentTime=t; updateTimeUI(); if(!state.isPlaying) drawStaticFrame();
}

/* ---------- THUMBNAILS ---------- */
async function generateThumbnails(){
  thumbStrip.innerHTML='';
  const tv=state.thumbVideo;
  await waitForEvent(tv,'loadedmetadata').catch(()=>{});
  const trackWidth=timelineTrack.clientWidth||800;
  const thumbW=100;
  const COUNT=Math.min(80, Math.max(16, Math.ceil(trackWidth/thumbW)));
  const tCanvas=document.createElement('canvas');
  tCanvas.width=160; tCanvas.height=Math.round(160*(state.videoH/state.videoW))||90;
  const tCtx=tCanvas.getContext('2d');
  const cells=[];
  for(let i=0;i<COUNT;i++){ const cell=document.createElement('div'); cell.className='thumb-cell'; thumbStrip.appendChild(cell); cells.push(cell); }
  for(let i=0;i<COUNT;i++){
    const time=(state.duration/COUNT)*(i+0.5);
    try{
      tv.currentTime=Math.min(time, Math.max(0, state.duration-0.05));
      await waitForSeek(tv);
      tCtx.drawImage(tv,0,0,tCanvas.width,tCanvas.height);
      cells[i].style.backgroundImage=`url(${tCanvas.toDataURL('image/jpeg',0.6)})`;
    }catch(e){}
  }
}

function pickMimeType(){
  const pref=FORMATS.find(f=>f.id===state.exportFormat);
  if(pref && typeof MediaRecorder!=='undefined' && MediaRecorder.isTypeSupported(pref.mime)) return pref.mime;
  const fallbacks=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(const o of fallbacks){ if(MediaRecorder.isTypeSupported(o)) return o; }
  return '';
}
function getFormatExt(){ const pref=FORMATS.find(f=>f.id===state.exportFormat); return pref?pref.ext:'webm'; }
/* FIX: the old formula (px*0.09, min 1.2Mbps) collapsed to the 1.2Mbps floor for both
   720p and 1080p, which is far too low a bitrate for those resolutions and caused
   heavy compression blur/blockiness on export. The new formula scales bitrate with
   both resolution AND frame rate (more frames per second need more bits/sec to stay
   sharp), with a much higher floor and ceiling. */
function computeBitrate(w,h,fps){ const px=w*h; const bitrate=Math.round(px*fps*0.12); return clamp(bitrate, 3000000, 80000000); }

function showExportProgress(){

  exportOverlay.classList.add('show');

}
function updateExportProgress(frac){ const el=document.getElementById('progFill'); if(el) el.style.width=Math.round(clamp(frac,0,1)*100)+'%'; }
function showExportDone(url, filename){

  $('#closeExportBtn').onclick=()=>{ exportOverlay.classList.remove('show'); URL.revokeObjectURL(url); };

exportBtn.addEventListener('click', async ()=>{
  if(!state.videoLoaded || state.isExporting) return;
  if(!window.MediaRecorder){ alert('Sorry, your browser does not support in-browser video export. Please try a recent version of Chrome, Edge, or Firefox.'); return; }
  try{ await runExport(); }catch(err){ console.error(err); showExportError('Something went wrong while exporting. Please try again, ideally with a shorter clip or lower resolution.'); state.isExporting=false; startPreviewLoop(); }
});

async function runExport(){
  ensureAudioGraph();
  if(state.audioCtx.state==='suspended') await state.audioCtx.resume();
  state.isExporting=true; state.exportCancelled=false;
  exportBtn.disabled=true; resSelect.disabled=true; formatSelect.disabled=true; fpsSelect.disabled=true;
  cancelAnimationFrame(state.previewRaf);
  showExportProgress();

  const wasPlaying=!state.video.paused;
  state.video.pause();

  const {w,h}=getOutputDims();
  const exCanvas=document.createElement('canvas'); exCanvas.width=w; exCanvas.height=h;
  const exCtx=exCanvas.getContext('2d');
  /* FIX: ensure the export canvas uses the highest-quality image resampling when
     scaling the source video into the output frame, instead of the browser default. */
  exCtx.imageSmoothingEnabled = true;
  exCtx.imageSmoothingQuality = 'high';

  const fps=state.exportFps;
  const videoStream=exCanvas.captureStream(fps);
  const combined=new MediaStream([...videoStream.getVideoTracks(), ...state.streamDest.stream.getAudioTracks()]);

  const mimeType=pickMimeType();
  /* FIX: always pass an explicit videoBitsPerSecond (previously this was skipped
     whenever mimeType was falsy, letting the browser fall back to a low default
     bitrate that produced blurry/blocky exports). */
  const recorderOptions={ videoBitsPerSecond: computeBitrate(w,h,fps) };
  if(mimeType) recorderOptions.mimeType = mimeType;
  const recorder=new MediaRecorder(combined, recorderOptions);
  const chunks=[];
  recorder.ondataavailable=e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
  const stopped=new Promise(resolve=>{ recorder.onstop=resolve; });

  state.video.currentTime=state.trimStart;
  state.video.playbackRate=state.playbackRate;
  await waitForSeek(state.video);

  recorder.start(500);
  await state.video.play();

  await new Promise(resolve=>{
    function frameLoop(){
      if(state.exportCancelled){ resolve(); return; }
      renderFrame(exCtx,w,h,{forExport:true});
      const frac=(state.video.currentTime-state.trimStart)/Math.max(0.001, state.trimEnd-state.trimStart);
      updateExportProgress(frac);
      if(state.video.currentTime>=state.trimEnd-0.02 || state.video.ended){ resolve(); return; }
      state.exportRaf=requestAnimationFrame(frameLoop);
    }
    state.exportRaf=requestAnimationFrame(frameLoop);
  });

  cancelAnimationFrame(state.exportRaf);
  state.video.pause();
  if(recorder.state!=='inactive') recorder.stop();
  await stopped;

  exportBtn.disabled=false; resSelect.disabled=false; formatSelect.disabled=false; fpsSelect.disabled=false;
  state.isExporting=false;

  if(state.exportCancelled){ exportOverlay.classList.remove('show'); }
  else if(chunks.length){
    const blob=new Blob(chunks, {type:mimeType||'video/webm'});
    const url=URL.createObjectURL(blob);
    const safeName=(state.fileName||'clipwell-export').replace(/\.[^.]+$/,'');
    showExportDone(url, `${safeName}-${state.resolution}.${getFormatExt()}`);
  } else { showExportError('No video data was captured. Please try again.'); }

  state.video.currentTime=state.trimStart;
  state.video.playbackRate=state.playbackRate;
  if(wasPlaying) state.video.play();
  startPreviewLoop();
  drawStaticFrame();
}

window.addEventListener('resize', ()=>{
  if(state.videoLoaded){ resizeCanvasForPreview(); generateThumbnails(); drawStaticFrame(); }
  if(!isMobile()) closePanel();
});

renderPanel();
updatePlayIcon();
})();
</script>
</body>
</html>
