<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browser Video Editor</title>

<style>
:root{
  --bg:#0f1117;
  --panel:#171a23;
  --panel2:#202431;
  --line:#303647;
  --text:#f4f6fb;
  --muted:#9aa3b6;
  --accent:#7c6cff;
  --accent2:#35d0ba;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  height:100vh;
  display:grid;
  grid-template-rows:58px 1fr 150px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#12151d;
  border-bottom:1px solid var(--line);
}

.brand{
  font-weight:800;
}

.brand span{
  color:var(--accent2);
}

.top-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.top-actions select,
.top-actions button{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:9px;
  padding:8px 10px;
}

.top-actions button{
  background:linear-gradient(
    135deg,
    var(--accent),
    #5c4cff
  );
  border:none;
  font-weight:700;
}

.top-actions button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.main{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:0;
}

.sidebar{
  border-right:1px solid var(--line);
  background:var(--panel);
  padding:14px;
  overflow:auto;
}

.group{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

.group h3{
  margin:0 0 10px;
  font-size:14px;
}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin:10px 0 6px;
}

input[type="range"]{
  width:100%;
}

input[type="text"],
input[type="number"],
select{
  width:100%;
  background:#11141c;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:8px;
  padding:8px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.smallbtn{
  width:100%;
  border:1px solid var(--line);
  background:#11141c;
  color:var(--text);
  border-radius:8px;
  padding:8px;
}

.smallbtn.active{
  outline:2px solid var(--accent);
  background:#1c2030;
}

.stage{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  min-width:0;
  min-height:0;

  background:
    radial-gradient(
      circle at 50% 0,
      #1b2030 0,
      #0e1016 70%
    );
}

.drop{
  width:min(620px,92%);
  border:2px dashed #46506a;
  border-radius:18px;
  padding:46px 20px;
  text-align:center;
  color:var(--muted);
  background:#141823;
  cursor:pointer;
}

.drop strong{
  display:block;
  color:var(--text);
  font-size:18px;
  margin-bottom:7px;
}

.canvas-wrap{
  display:none;
  max-width:100%;
  max-height:100%;
  align-items:center;
  justify-content:center;
}

canvas{
  max-width:100%;
  max-height:100%;
  background:#000;
  border-radius:12px;
  box-shadow:0 18px 60px #0008;
  touch-action:none;
}

.timeline{
  padding:10px 16px 14px;
  background:var(--panel);
  border-top:1px solid var(--line);
}

.transport{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}

.transport button{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  border-radius:9px;
  padding:7px 12px;
}

.time{
  font-size:12px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}

.seek{
  width:100%;
}

.trim-row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:10px;
  align-items:end;
  margin-top:8px;
}

.trim-row label{
  margin:0 0 5px;
}

.status{
  font-size:12px;
  color:var(--muted);
  margin-left:auto;
}

.hidden{
  display:none!important;
}

.toast{
  position:fixed;
  left:50%;
  bottom:165px;
  transform:translateX(-50%);
  background:#242936;
  color:white;
  border:1px solid var(--line);
  padding:10px 14px;
  border-radius:10px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:50;
}

.toast.show{
  opacity:1;
}

.overlay{
  position:fixed;
  inset:0;
  background:#000a;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.overlay.show{
  display:flex;
}

.card{
  width:min(420px,90vw);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px;
  text-align:center;
}

.bar{
  height:8px;
  background:#2b3040;
  border-radius:99px;
  overflow:hidden;
  margin:14px 0;
}

.bar > div{
  height:100%;
  width:0;
  background:
    linear-gradient(
      90deg,
      var(--accent),
      var(--accent2)
    );
}

@media(max-width:820px){

  body{
    overflow:auto;
  }

  .app{
    height:auto;
    min-height:100vh;
    grid-template-rows:auto auto auto;
  }

  .main{
    grid-template-columns:1fr;
  }

  .sidebar{
    order:2;
    border-right:none;
    border-top:1px solid var(--line);
  }

  .stage{
    min-height:52vh;
  }

  .timeline{
    position:sticky;
    bottom:0;
    z-index:10;
  }

  .top-actions{
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .trim-row{
    grid-template-columns:1fr 1fr;
  }

  .trim-row button{
    grid-column:1/-1;
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="brand">
    Mini<span>Cut</span> Video Editor
  </div>

  <div class="top-actions">

    <select id="quality" disabled>
      <option value="480">480p</option>
      <option value="720" selected>720p</option>
      <option value="1080">1080p</option>
    </select>

    <select id="fps" disabled>
      <option value="24">24 FPS</option>
      <option value="30" selected>30 FPS</option>
      <option value="60">60 FPS</option>
    </select>

    <button id="exportBtn" disabled>
      Export WebM
    </button>

  </div>

</header>

<div class="main">

<aside class="sidebar">

  <div class="group">

    <h3>Transform</h3>

    <div class="row">

      <button class="smallbtn" id="rotLeft">
        ↺ Rotate
      </button>

      <button class="smallbtn" id="rotRight">
        ↻ Rotate
      </button>

    </div>

    <div class="row" style="margin-top:8px">

      <button class="smallbtn" id="flipH">
        Flip H
      </button>

      <button class="smallbtn" id="flipV">
        Flip V
      </button>

    </div>

  </div>

  <div class="group">

    <h3>Speed & Audio</h3>

    <label>
      Speed
      <span id="speedVal">1.00×</span>
    </label>

    <input
      id="speed"
      type="range"
      min="0.25"
      max="2"
      value="1"
      step="0.05"
    />

    <label>
      Volume
      <span id="volumeVal">100%</span>
    </label>

    <input
      id="volume"
      type="range"
      min="0"
      max="100"
      value="100"
      step="1"
    />

  </div>

  <div class="group">

    <h3>Filters</h3>

    <label>
      Brightness
      <span id="brightnessVal">100%</span>
    </label>

    <input
      id="brightness"
      type="range"
      min="50"
      max="150"
      value="100"
    />

    <label>
      Contrast
      <span id="contrastVal">100%</span>
    </label>

    <input
      id="contrast"
      type="range"
      min="50"
      max="150"
      value="100"
    />

    <label>
      Saturation
      <span id="saturationVal">100%</span>
    </label>

    <input
      id="saturation"
      type="range"
      min="0"
      max="200"
      value="100"
    />

    <label>
      Grayscale
      <span id="grayscaleVal">0%</span>
    </label>

    <input
      id="grayscale"
      type="range"
      min="0"
      max="100"
      value="0"
    />

  </div>

  <div class="group">

    <h3>Text Overlay</h3>

    <label>Text</label>

    <input
      id="textInput"
      type="text"
      placeholder="Type text..."
    />

    <div class="row">

      <div>

        <label>Size</label>

        <input
          id="textSize"
          type="range"
          min="18"
          max="120"
          value="48"
        />

      </div>

      <div>

        <label>Color</label>

        <input
          id="textColor"
          type="color"
          value="#ffffff"
          style="
            width:100%;
            height:38px;
            background:#11141c;
            border:1px solid var(--line);
            border-radius:8px
          "
        />

      </div>

    </div>

    <label>Position X</label>

    <input
      id="textX"
      type="range"
      min="0"
      max="100"
      value="50"
    />

    <label>Position Y</label>

    <input
      id="textY"
      type="range"
      min="0"
      max="100"
      value="85"
    />

    <button
      class="smallbtn"
      id="clearText"
      style="margin-top:8px"
    >
      Clear text
    </button>

  </div>

</aside>

<main class="stage">

  <div id="drop" class="drop">

    <strong>
      Drop a video here
    </strong>

    or click to choose a video file

    <div
      style="
        margin-top:8px;
        font-size:12px
      "
    >
      Works best in Chrome / Edge.
      Export is WebM.
    </div>

  </div>

  <div
    id="canvasWrap"
    class="canvas-wrap"
  >

    <canvas
      id="canvas"
      width="1280"
      height="720"
    ></canvas>

  </div>

  <input
    id="file"
    type="file"
    accept="video/*"
    class="hidden"
  />

  <video
    id="video"
    playsinline
    preload="metadata"
    class="hidden"
  ></video>

</main>

</div>

<section class="timeline">

<div class="transport">

  <button id="playBtn" disabled>
    ▶ Play
  </button>

  <button id="backBtn" disabled>
    -1s
  </button>

  <button id="forwardBtn" disabled>
    +1s
  </button>

  <div
    class="time"
    id="timeLabel"
  >
    0:00.00 / 0:00.00
  </div>

  <div
    class="status"
    id="status"
  >
    No video loaded
  </div>

</div>

<input
  id="seek"
  class="seek"
  type="range"
  min="0"
  max="1000"
  value="0"
  disabled
/>

<div class="trim-row">

  <div>

    <label>
      Trim start (seconds)
    </label>

    <input
      id="trimStart"
      type="number"
      min="0"
      value="0"
      step="0.01"
      disabled
    />

  </div>

  <div>

    <label>
      Trim end (seconds)
    </label>

    <input
      id="trimEnd"
      type="number"
      min="0"
      value="0"
      step="0.01"
      disabled
    />

  </div>

  <button
    class="smallbtn"
    id="resetTrim"
    disabled
  >
    Reset trim
  </button>

</div>

</section>

</div>

<div
  id="toast"
  class="toast"
></div>

<div
  id="overlay"
  class="overlay"
>

<div class="card">

  <h3
    id="overlayTitle"
    style="margin-top:0"
  >
    Exporting...
  </h3>

  <div
    id="overlayText"
    style="
      font-size:13px;
      color:var(--muted)
    "
  >
    Export runs in real time.
  </div>

  <div class="bar">
    <div id="progress"></div>
  </div>

  <button
    id="cancelExport"
    class="smallbtn"
  >
    Cancel
  </button>

</div>

</div>

<script>
(() => {

"use strict";

const $ =
s => document.querySelector(s);

const video =
$("#video");

const canvas =
$("#canvas");

const ctx =
canvas.getContext(
  "2d",
  {alpha:false}
);

const fileInput =
$("#file");

const drop =
$("#drop");

const canvasWrap =
$("#canvasWrap");

const playBtn =
$("#playBtn");

const backBtn =
$("#backBtn");

const forwardBtn =
$("#forwardBtn");

const seek =
$("#seek");

const timeLabel =
$("#timeLabel");

const status =
$("#status");

const trimStartInput =
$("#trimStart");

const trimEndInput =
$("#trimEnd");

const resetTrim =
$("#resetTrim");

const exportBtn =
$("#exportBtn");

const quality =
$("#quality");

const fpsSelect =
$("#fps");

const overlay =
$("#overlay");

const overlayTitle =
$("#overlayTitle");

const overlayText =
$("#overlayText");

const progress =
$("#progress");

const cancelExportBtn =
$("#cancelExport");

const toast =
$("#toast");

const controls = {

  speed:
  $("#speed"),

  volume:
  $("#volume"),

  brightness:
  $("#brightness"),

  contrast:
  $("#contrast"),

  saturation:
  $("#saturation"),

  grayscale:
  $("#grayscale"),

  text:
  $("#textInput"),

  textSize:
  $("#textSize"),

  textColor:
  $("#textColor"),

  textX:
  $("#textX"),

  textY:
  $("#textY")

};

const state = {

  loaded:false,

  duration:0,

  trimStart:0,

  trimEnd:0,

  rotate:0,

  flipH:false,

  flipV:false,

  speed:1,

  volume:1,

  brightness:100,

  contrast:100,

  saturation:100,

  grayscale:0,

  text:"",

  textSize:48,

  textColor:"#ffffff",

  textX:.5,

  textY:.85,

  raf:0,

  objectUrl:null,

  exporting:false,

  cancelExport:false,

  audioCtx:null,

  sourceNode:null,

  gainNode:null,

  destination:null,

  draggingText:false

};

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}

function fmt(time){

  if(
    !Number.isFinite(time)
  ){
    time=0;
  }

  const minutes =
  Math.floor(
    time/60
  );

  const seconds =
  Math.floor(
    time%60
  );

  const centiseconds =
  Math.floor(
    (time%1)*100
  );

  return (
    minutes+
    ":"+
    String(seconds)
    .padStart(2,"0")+
    "."+
    String(centiseconds)
    .padStart(2,"0")
  );

}

function notify(message){

  toast.textContent =
  message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    notify.timer
  );

  notify.timer =
  setTimeout(
    ()=>{

      toast.classList.remove(
        "show"
      );

    },
    2600
  );

}

function waitEvent(
  element,
  name,
  timeout=10000
){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const onOk =
      ()=>done(resolve);

      const onErr =
      ()=>done(
        ()=>reject(
          new Error(
            `Failed while waiting for ${name}`
          )
        )
      );

      const timer =
      setTimeout(
        ()=>done(
          ()=>reject(
            new Error(
              `Timed out waiting for ${name}`
            )
          )
        ),
        timeout
      );

      function done(fn){

        clearTimeout(timer);

        element.removeEventListener(
          name,
          onOk
        );

        element.removeEventListener(
          "error",
          onErr
        );

        if(
          typeof fn==="function"
        ){
          fn();
        }

      }

      element.addEventListener(
        name,
        onOk,
        {once:true}
      );

      element.addEventListener(
        "error",
        onErr,
        {once:true}
      );

    }
  );

}

async function seekVideo(time){

  time =
  clamp(
    time,
    0,
    state.duration||0
  );

  if(
    Math.abs(
      video.currentTime-time
    ) < .002 &&
    !video.seeking
  ){
    return;
  }

  const promise =
  waitEvent(
    video,
    "seeked"
  );

  video.currentTime =
  time;

  await promise;

}

function updateCanvasSize(){

  if(
    !state.loaded
  ){
    return;
  }

  const rotated =
  state.rotate%180!==0;

  const videoWidth =
  rotated
  ?video.videoHeight
  :video.videoWidth;

  const videoHeight =
  rotated
  ?video.videoWidth
  :video.videoHeight;

  const maxWidth =
  Math.max(
    320,
    Math.min(
      1280,
      window.innerWidth-340
    )
  );

  const maxHeight =
  Math.max(
    240,
    Math.min(
      720,
      window.innerHeight-240
    )
  );

  const scale =
  Math.min(
    maxWidth/videoWidth,
    maxHeight/videoHeight,
    1
  );

  canvas.width =
  Math.max(
    2,
    Math.round(
      videoWidth*scale
    )
  );

  canvas.height =
  Math.max(
    2,
    Math.round(
      videoHeight*scale
    )
  );

}

function applyAudio(){

  if(
    state.gainNode
  ){

    state.gainNode.gain.value =
    state.volume;

  }else{

    video.volume =
    state.volume;

  }

}

function ensureAudioGraph(){

  if(
    state.audioCtx
  ){
    return true;
  }

  const AudioClass =
  window.AudioContext ||
  window.webkitAudioContext;

  if(
    !AudioClass
  ){
    return false;
  }

  try{

    state.audioCtx =
    new AudioClass();

    state.sourceNode =
    state.audioCtx
    .createMediaElementSource(
      video
    );

    state.gainNode =
    state.audioCtx
    .createGain();

    state.destination =
    state.audioCtx
    .createMediaStreamDestination();

    state.sourceNode.connect(
      state.gainNode
    );

    state.gainNode.connect(
      state.audioCtx.destination
    );

    state.gainNode.connect(
      state.destination
    );

    applyAudio();

    return true;

  }catch(error){

    return false;

  }

}

function render(){

  if(
    !state.loaded
  ){
    return;
  }

  const width =
  canvas.width;

  const height =
  canvas.height;

  ctx.save();

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  ctx.fillStyle =
  "#000";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

  ctx.filter =
  `brightness(${state.brightness}%)
   contrast(${state.contrast}%)
   saturate(${state.saturation}%)
   grayscale(${state.grayscale}%)`;

  ctx.translate(
    width/2,
    height/2
  );

  ctx.rotate(
    state.rotate*
    Math.PI/180
  );

  ctx.scale(
    state.flipH?-1:1,
    state.flipV?-1:1
  );

  const drawWidth =
  state.rotate%180!==0
  ?height
  :width;

  const drawHeight =
  state.rotate%180!==0
  ?width
  :height;

  try{

    ctx.drawImage(
      video,
      -drawWidth/2,
      -drawHeight/2,
      drawWidth,
      drawHeight
    );

  }catch(error){}

  ctx.restore();

  ctx.filter =
  "none";

  if(
    state.text.trim()
  ){

    const size =
    Math.max(
      12,
      state.textSize*
      (height/720)
    );

    ctx.save();

    ctx.font =
    `700 ${size}px Arial`;

    ctx.textAlign =
    "center";

    ctx.textBaseline =
    "middle";

    ctx.lineWidth =
    Math.max(
      2,
      size*.08
    );

    ctx.strokeStyle =
    "rgba(0,0,0,.75)";

    ctx.fillStyle =
    state.textColor;

    const x =
    state.textX*
    width;

    const y =
    state.textY*
    height;

    ctx.strokeText(
      state.text,
      x,
      y
    );

    ctx.fillText(
      state.text,
      x,
      y
    );

    ctx.restore();

  }

}

function drawLoop(){

  render();

  updateTimeline();

  if(
    !video.paused &&
    !video.ended &&
    !state.exporting
  ){

    state.raf =
    requestAnimationFrame(
      drawLoop
    );

  }

}

function updateTimeline(){

  if(
    !state.loaded
  ){
    return;
  }

  seek.value =
  Math.round(
    (
      video.currentTime/
      state.duration
    )*
    1000
  ) || 0;

  timeLabel.textContent =
  `${fmt(video.currentTime)} / ${fmt(state.duration)}`;

  if(
    !state.exporting &&
    video.currentTime >=
    state.trimEnd-.01 &&
    !video.paused
  ){

    video.pause();

    seekVideo(
      state.trimStart
    ).then(
      ()=>{

        render();

        updateTimeline();

      }
    );

  }

}

async function loadFile(file){

  if(
    !file ||
    !(file.type||"")
    .startsWith("video/")
  ){

    notify(
      "Please choose a video file."
    );

    return;

  }

  if(
    state.objectUrl
  ){

    URL.revokeObjectURL(
      state.objectUrl
    );

  }

  state.objectUrl =
  URL.createObjectURL(
    file
  );

  video.src =
  state.objectUrl;

  video.load();

  try{

    await waitEvent(
      video,
      "loadedmetadata"
    );

  }catch(error){

    notify(
      "This video format or codec is not supported by your browser."
    );

    return;

  }

  state.loaded =
  true;

  state.duration =
  video.duration;

  state.trimStart =
  0;

  state.trimEnd =
  video.duration;

  video.playbackRate =
  state.speed;

  applyAudio();

  drop.style.display =
  "none";

  canvasWrap.style.display =
  "flex";

  trimStartInput.value =
  "0";

  trimEndInput.value =
  video.duration.toFixed(2);

  [
    playBtn,
    backBtn,
    forwardBtn,
    seek,
    trimStartInput,
    trimEndInput,
    resetTrim,
    exportBtn,
    quality,
    fpsSelect
  ].forEach(
    element=>{
      element.disabled=false;
    }
  );

  status.textContent =
  `${video.videoWidth}×${video.videoHeight} • ${fmt(video.duration)}`;

  updateCanvasSize();

  await seekVideo(0);

  render();

  updateTimeline();

}

playBtn.addEventListener(
  "click",
  async()=>{

    if(
      !state.loaded

    ensureAudioGraph();

    if(
      state.audioCtx?.state ===
      "suspended"
    ){

      await state.audioCtx
      .resume()
      .catch(()=>{});

    }

    if(
      video.paused
    ){

      if(
        video.currentTime <
        state.trimStart ||
        video.currentTime >=
        state.trimEnd
      ){

        await seekVideo(
          state.trimStart
        );

      }

      video.playbackRate =
      state.speed;

      try{

        await video.play();

        playBtn.textContent =
        "❚❚ Pause";

        drawLoop();

      }catch(error){

        notify(
          "Playback was blocked. Click Play again."
        );

      }

    }else{

      video.pause();

      playBtn.textContent =
      "▶ Play";

    }

  }
);

function syncTrim(){

  let start =
  clamp(
    parseFloat(
      trimStartInput.value
    ) || 0,
    0,
    state.duration
  );

  let end =
  clamp(
    parseFloat(
      trimEndInput.value
    ) ||
    state.duration,
    0,
    state.duration
  );

  if(
    end-start < .05
  ){

    end =
    Math.min(
      state.duration,
      start+.05
    );

    if(
      end-start < .05
    ){

      start =
      Math.max(
        0,
        end-.05
      );

    }

  }

  state.trimStart =
  start;

  state.trimEnd =
  end;

  trimStartInput.value =
  start.toFixed(2);

  trimEndInput.value =
  end.toFixed(2);

  if(
    video.currentTime < start ||
    video.currentTime > end
  ){

    seekVideo(
      start
    ).then(
      ()=>{

        render();

        updateTimeline();

      }
    );

  }

}

function bindRange(
  id,
  property,
  suffix="%",
  transform=value=>+value
){

  const element =
  $(id);

  const output =
  $(id+"Val");

  element.addEventListener(
    "input",
    ()=>{

      state[property] =
      transform(
        element.value
      );

      if(
        output
      ){

        output.textContent =
        `${element.value}${suffix}`;

      }

      render();

    }
  );

}

function pointerToCanvas(event){

  const rect =
  canvas.getBoundingClientRect();

  const point =
  event.touches
  ?event.touches[0]
  :event;

  return{

    x:
    (
      point.clientX-
      rect.left
    )/
    rect.width,

    y:
    (
      point.clientY-
      rect.top
    )/
    rect.height

  };

}

canvas.addEventListener(
  "pointerdown",
  event=>{

    if(
      !state.text.trim()
    ){
      return;
    }

    state.draggingText =
    true;

    const position =
    pointerToCanvas(
      event
    );

    state.textX =
    clamp(
      position.x,
      0,
      1
    );

    state.textY =
    clamp(
      position.y,
      0,
      1
    );

    controls.textX.value =
    Math.round(
      state.textX*100
    );

    controls.textY.value =
    Math.round(
      state.textY*100
    );

    render();

  }
);

window.addEventListener(
  "pointermove",
  event=>{

    if(
      !state.draggingText
    ){
      return;
    }

    const position =
    pointerToCanvas(
      event
    );

    state.textX =
    clamp(
      position.x,
      0,
      1
    );

    state.textY =
    clamp(
      position.y,
      0,
      1
    );

    controls.textX.value =
    Math.round(
      state.textX*100
    );

    controls.textY.value =
    Math.round(
      state.textY*100
    );

    render();

  }
);

  "pointerup",

    state.draggingText =

  }
);

function pickMime(){

  const formats = [

    "video/webm;codecs=vp9,opus",

    "video/webm;codecs=vp8,opus",

    "video/webm"

  ];

  return formats.find(
    format=>
    MediaRecorder
    .isTypeSupported(format)
  ) || "";

}

function exportDims(){

  const targetHeight =
  +quality.value;

  const rotated =
  state.rotate%180!==0;

  const aspect =
  rotated
  ?video.videoHeight/
   video.videoWidth
  :video.videoWidth/
   video.videoHeight;

  let height =
  targetHeight;

  let width =
  Math.round(
    targetHeight*
    aspect
  );

  if(
    width%2
  ){
    width++;
  }

  return{
    w:width,
    h:height
  };

}

function renderTo(
  targetCtx,
  width,
  height
){

  targetCtx.save();

  targetCtx.fillStyle =
  "#000";

  targetCtx.fillRect(
    0,
    0,
    width,
    height
  );

  targetCtx.filter =
  `brightness(${state.brightness}%)
   contrast(${state.contrast}%)
   saturate(${state.saturation}%)
   grayscale(${state.grayscale}%)`;

  targetCtx.translate(
    width/2,
    height/2
  );

  targetCtx.rotate(
    state.rotate*
    Math.PI/180
  );

  targetCtx.scale(
    state.flipH?-1:1,
    state.flipV?-1:1
  );

  const drawWidth =
  state.rotate%180!==0
  ?height
  :width;

  const drawHeight =
  state.rotate%180!==0
  ?width
  :height;

  targetCtx.drawImage(
    video,
    -drawWidth/2,
    -drawHeight/2,
    drawWidth,
    drawHeight
  );

  targetCtx.restore();

  targetCtx.filter =
  "none";

  if(
    state.text.trim()
  ){

    const size =
    Math.max(
      12,
      state.textSize*
      (height/720)
    );

    targetCtx.save();

    targetCtx.font =
    `700 ${size}px Arial`;

    targetCtx.textAlign =
    "center";

    targetCtx.textBaseline =
    "middle";

    targetCtx.lineWidth =
    Math.max(
      2,
      size*.08
    );

    targetCtx.strokeStyle =
    "rgba(0,0,0,.75)";

    targetCtx.fillStyle =
    state.textColor;

    const x =
    state.textX*
    width;

    const y =
    state.textY*
    height;

    targetCtx.strokeText(
      state.text,
      x,
      y
    );

    targetCtx.fillText(
      state.text,
      x,
      y
    );

    targetCtx.restore();

  }

}

cancelExportBtn.addEventListener(
  "click",
  ()=>{

    state.cancelExport =
    true;

  }
);

exportBtn.addEventListener(
  "click",
  async()=>{

    if(
      !state.loaded ||
      state.exporting
    ){
      return;
    }

    if(
      typeof MediaRecorder ===
      "undefined"
    ){

      notify(
        "MediaRecorder is not supported in this browser."
      );

      return;

    }

    const mime =
    pickMime();

    if(
      !mime
    ){

      notify(
        "This browser cannot export WebM. Try Chrome or Edge."
      );

      return;

    }

    state.exporting =
    true;

    state.cancelExport =
    false;

    overlay.classList.add(
      "show"
    );

    overlayTitle.textContent =
    "Exporting...";

    overlayText.textContent =
    "Export runs in real time. Keep this tab open.";

    progress.style.width =
    "0%";

    const oldTime =
    video.currentTime;

    const wasPlaying =
    !video.paused;

    video.pause();

    try{

      ensureAudioGraph();

      if(
        state.audioCtx?.state ===
        "suspended"
      ){

        await state.audioCtx
        .resume()
        .catch(()=>{});

      }

      const {w,h} =
      exportDims();

      const fps =
      +fpsSelect.value;

      const output =
      document.createElement(
        "canvas"
      );

      output.width =
      w;

      output.height =
      h;

      const outputCtx =
      output.getContext(
        "2d",
        {alpha:false}
      );

      const videoStream =
      output.captureStream(
        fps
      );

      const tracks = [
        ...videoStream
        .getVideoTracks()
      ];

      if(
        state.destination
      ){

        tracks.push(
          ...state.destination
          .stream
          .getAudioTracks()
        );

      }

      const stream =
      new MediaStream(
        tracks
      );

      const bitrate =
      clamp(
        Math.round(
          w*
          h*
          fps*
          .10
        ),
        2500000,
        30000000
      );

      const recorder =
      new MediaRecorder(
        stream,
        {
          mimeType:mime,
          videoBitsPerSecond:
          bitrate
        }
      );

      const chunks = [];

      recorder.ondataavailable =
      event=>{

        if(
          event.data?.size
        ){

          chunks.push(
            event.data
          );

        }

      };

      const stopped =
      new Promise(
        (
          resolve,
          reject
        )=>{

          recorder.onstop =
          resolve;

          recorder.onerror =
          event=>
          reject(
            event.error ||
            new Error(
              "Recorder error"
            )
          );

        }
      );

      await seekVideo(
        state.trimStart
      );

      video.playbackRate =
      state.speed;

      recorder.start(
        500
      );

      await video.play();

      await new Promise(
        resolve=>{

          function loop(){

            renderTo(
              outputCtx,
              w,
              h
            );

            const fraction =
            (
              video.currentTime-
              state.trimStart
            )/
            Math.max(
              .001,
              state.trimEnd-
              state.trimStart
            );

            progress.style.width =
            (
              clamp(
                fraction,
                0,
                1
              )*
              100
            ).toFixed(0)+
            "%";

            if(
              state.cancelExport ||
              video.currentTime >=
              state.trimEnd-.02 ||
              video.ended
            ){

              resolve();

              return;

            }

            requestAnimationFrame(
              loop
            );

          }

          requestAnimationFrame(
            loop
          );

        }
      );

      video.pause();

      if(
        recorder.state !==
        "inactive"
      ){

        recorder.stop();

      }

      await stopped;

      videoStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

      if(
        state.cancelExport
      ){

        overlay.classList.remove(
          "show"
        );

      }else if(
        chunks.length
      ){

        const blob =
        new Blob(
          chunks,
          {type:mime}
        );

        const url =
        URL.createObjectURL(
          blob
        );

        const link =
        document.createElement(
          "a"
        );

        link.href =
        url;

        link.download =
        "edited-video.webm";

        document.body.appendChild(
          link
        );

        link.click();

        link.remove();

        overlayTitle.textContent =
        "Export complete";

        overlayText.textContent =
        "Your edited video has been downloaded.";

        progress.style.width =
        "100%";

        cancelExportBtn.textContent =
        "Close";

        cancelExportBtn.onclick =
        ()=>{

          overlay.classList.remove(
            "show"
          );

          cancelExportBtn.textContent =
          "Cancel";

          cancelExportBtn.onclick =
          null;

          URL.revokeObjectURL(
            url
          );

        };

      }else{

        throw new Error(
          "No video data was produced."
        );

      }

    }catch(error){

      console.error(
        error
      );

      overlay.classList.remove(
        "show"
      );

      notify(
        error.message ||
        "Export failed."
      );

    }finally{

      state.exporting =
      false;

      video.playbackRate =
      state.speed;

      try{

        await seekVideo(
          clamp(
            oldTime,
            state.trimStart,
            state.trimEnd
          )
        );

      }catch(error){}

      render();

      updateTimeline();

      if(
        wasPlaying &&
        !state.cancelExport
      ){

        video.play()
        .then(drawLoop)
        .catch(()=>{});

      }

    }

  }
);

window.addEventListener(
  "resize",
  ()=>{

    if(
      state.loaded
    ){

      updateCanvasSize();

      render();

    }

  }
);

window.addEventListener(
  "beforeunload",
  ()=>{

    if(
      state.objectUrl
    ){

      URL.revokeObjectURL(
        state.objectUrl
      );

    }

  }
);

})();
</script>
